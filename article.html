<!DOCTYPE html>
<html lang="ja">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KD054RHKQ8"></script>
    <script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記事 | FFXI Bismarck</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@300;400;500&family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .article-layout { display: flex; gap: 2rem; align-items: flex-start; }
        .article-main { flex: 1; min-width: 0; }
        .toc-sidebar { width: 250px; position: sticky; top: 120px; background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); border-radius: 12px; padding: 1.5rem; display: none; }
        @media (min-width: 1024px) { .toc-sidebar { display: block; } }
        .toc-sidebar h4 { color: var(--accent-color); margin-bottom: 1rem; font-family: 'Noto Sans JP', sans-serif; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 { font-family: 'Zen Maru Gothic', sans-serif; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.5rem; }
        .toc-sidebar ul { list-style: none; padding-left: 0; }
        .toc-sidebar li { margin-bottom: 0.8rem; }
        .toc-sidebar a { color: var(--text-light); text-decoration: none; font-size: 0.95rem; transition: color 0.3s; }
        .toc-sidebar a:hover { color: var(--primary-color); }
        #back-to-top { position: fixed; bottom: 30px; right: 30px; width: 50px; height: 50px; border-radius: 50%; background: var(--primary-color); color: #111; border: none; font-size: 1.5rem; cursor: pointer; display: none; justify-content: center; align-items: center; z-index: 1000; }
        .article-container { margin-top: 120px; margin-bottom: 100px; max-width: 900px; }
        .back-btn { display: inline-block; margin-bottom: 2rem; color: var(--text-light); text-decoration: none; font-weight: bold; background: rgba(255, 255, 255, 0.1); padding: 0.8rem 1.5rem; border-radius: 30px; }
        .markdown-body { color: var(--text-light); line-height: 1.8; padding: 1rem; font-family: 'Noto Sans JP', sans-serif; }
        .markdown-body h1 { color: var(--accent-color); font-size: 2.2rem; margin-bottom: 2rem; border-bottom: 2px solid var(--accent-color); }
        .markdown-body h2 { color: white; font-size: 1.6rem; margin-top: 2.5rem; border-left: 5px solid var(--primary-color); padding-left: 1rem; }
        .markdown-body p, .markdown-body li { font-size: 1.1rem; margin-bottom: 1rem; }
        .markdown-body a { color: #a8e063; text-decoration: none; border-bottom: 1px dashed #a8e063; font-weight: 700; }
        .auto-link { color: #a8e063; font-weight: 700; text-decoration: none; border-bottom: 1px dashed #a8e063; }
        .highlight-bracket { color: #ffb700; font-weight: bold; text-shadow: 0 0 8px rgba(255, 183, 0, 0.2); }
    </style>
</head>
<body>
    <div id="particle-canvas-container"></div>
    <header class="glass-header">
        <div class="logo"><a href="index.html" style="color: inherit; text-decoration: none;">FFXI Bismarck</a></div>
    </header>

    <main class="container article-container">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> トップページへ戻る</a>
        <div class="article-layout">
            <div class="article-main">
                <div class="glass-card" style="padding: 2rem 3rem;">
                    <div id="markdown-content" class="markdown-body">
                        <div style="text-align: center; padding: 3rem 0;"><i class="fa-solid fa-spinner fa-spin fa-3x" style="color: var(--accent-color);"></i><p>記事を読み込み中...</p></div>
                    </div>
                </div>
            </div>
            <aside class="toc-sidebar" id="toc-sidebar"><h4 style="margin-top:0;"><i class="fa-solid fa-list"></i> 目次</h4><ul id="toc-list"></ul></aside>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const file = urlParams.get('file');
        const contentDiv = document.getElementById('markdown-content');

        if (file) {
            fetch(file)
                .then(r => r.ok ? r.text() : Promise.reject('File not found'))
                .then(text => {
                    const processedText = text.replace(/([「『])([^」』\n]+)([」』])/g, '<span class="highlight-bracket">$1$2$3</span>');
                    contentDiv.innerHTML = marked.parse(processedText);

                    const linkMap = {
                        "ロスタム": "https://wiki.ffo.jp/html/37235.html", "ニャメ装束": "https://wiki.ffo.jp/html/38283.html", "マリグナス装束": "https://wiki.ffo.jp/html/39726.html",
                        "イケンガ装束": "https://wiki.ffo.jp/html/38196.html", "シャスーアタイア": "https://wiki.ffo.jp/html/33205.html", "ラヌンアタイア": "https://wiki.ffo.jp/html/30924.html",
                        "アデマ装束": "http://wiki.ffo.jp/html/34613.html", "カコエシクリング": "http://wiki.ffo.jp/html/34650.html", "クロノブレット": "http://wiki.ffo.jp/html/35442.html",
                        "昏黄の指輪": "http://wiki.ffo.jp/html/38369.html", "オノワイヤリング": "http://wiki.ffo.jp/html/35440.html", "ベイラピアス": "http://wiki.ffo.jp/html/37879.html",
                        "シーリチリング": "http://wiki.ffo.jp/html/35694.html", "イフラマドリング": "http://wiki.ffo.jp/html/39089.html", "霊亀腰帯": "http://wiki.ffo.jp/html/34718.html",
                        "ライヴブレット": "http://wiki.ffo.jp/html/35445.html", "カムラスマント": "http://wiki.ffo.jp/html/35517.html", "王将の首飾り": "http://wiki.ffo.jp/html/36145.html",
                        "クレパスクラナイフ": "http://wiki.ffo.jp/html/38361.html", "ベヨーブレット": "http://wiki.ffo.jp/html/39083.html", "昏黄の耳飾り": "http://wiki.ffo.jp/html/38368.html",
                        "ラヌンナイフ": "https://wiki.ffo.jp/html/37235.html",
                        "ドミネンスピアス": "http://wiki.ffo.jp/html/34878.html", "クスタウィ": "http://wiki.ffo.jp/html/35435.html", "インパルスベルト": "http://wiki.ffo.jp/html/20373.html",
                        "フリオミシピアス": "http://wiki.ffo.jp/html/29865.html", "胡蝶のイヤリング": "https://wiki.ffo.jp/html/22306.html", "ネイグリング": "http://wiki.ffo.jp/html/37597.html",
                        "イシュクターバン": "http://wiki.ffo.jp/html/40007.html", "メランリング": "http://wiki.ffo.jp/html/39711.html", "コモドアチャーム": "http://wiki.ffo.jp/html/37218.html",
                        "アルコンリング": "http://wiki.ffo.jp/html/24057.html", "エアバニピアス": "http://wiki.ffo.jp/html/34143.html", "セールフィベルト": "http://wiki.ffo.jp/html/32262.html",
                        "共和プラチナ章": "http://wiki.ffo.jp/html/38491.html", "守りの指輪": "http://wiki.ffo.jp/html/2290.html", "フォーマルハウト": "http://wiki.ffo.jp/html/35356.html",
                        "カフカチナベルト": "http://wiki.ffo.jp/html/35702.html", "テロスピアス": "http://wiki.ffo.jp/html/34761.html", "無の面": "http://wiki.ffo.jp/html/39387.html",
                        "カラクトチョーカー": "http://wiki.ffo.jp/html/17288.html", "妖蟲の髪飾り": "http://wiki.ffo.jp/html/20388.html", "キャリアーサッシュ": "http://wiki.ffo.jp/html/26679.html",
                        "イスクルゴルゲット": "http://wiki.ffo.jp/html/35917.html", "エパミノダスリング": "http://wiki.ffo.jp/html/37381.html", "グレティナイフ": "http://wiki.ffo.jp/html/38205.html",
                        "アタクトス": "http://wiki.ffo.jp/html/25813.html", "フォシャベルト": "http://wiki.ffo.jp/html/32705.html", "ルザフリング": "http://wiki.ffo.jp/html/12946.html",
                        "デベステトブレット": "http://wiki.ffo.jp/html/35443.html", "ディンジルリング": "http://wiki.ffo.jp/html/35914.html", "八輪の帯": "http://wiki.ffo.jp/html/32704.html",
                        "素破の耳": "http://wiki.ffo.jp/html/317.html", "無の喉輪": "http://wiki.ffo.jp/html/39388.html", "無の外装": "http://wiki.ffo.jp/html/39389.html",
                        "無の腰当": "http://wiki.ffo.jp/html/39390.html", "オルペウスサッシュ": "http://wiki.ffo.jp/html/37383.html", "シャスーピアス": "http://wiki.ffo.jp/html/38629.html",
                        "コンペンセーター": "http://wiki.ffo.jp/html/34211.html", "国崩し": "http://wiki.ffo.jp/html/34651.html", "デスペナルティ": "http://wiki.ffo.jp/html/483.html",
                        "アープ": "http://wiki.ffo.jp/html/38967.html", "ドゥームズデイ": "http://wiki.ffo.jp/html/31687.html", "ロリケートトルク": "http://wiki.ffo.jp/html/34648.html",
                        "ハーティピアス": "http://wiki.ffo.jp/html/26663.html", "アナーキー": "http://wiki.ffo.jp/html/20554.html", "プラチナモグベルト": "http://wiki.ffo.jp/html/39028.html",
                        "エナベートピアス": "http://wiki.ffo.jp/html/33195.html", "ネリチックピアス": "http://wiki.ffo.jp/html/31957.html", "ハイドゥクリング": "http://wiki.ffo.jp/html/26473.html",
                        "ポネンテサッシュ": "http://wiki.ffo.jp/html/31956.html", "アクィラインベルト": "http://wiki.ffo.jp/html/20486.html", "火輪の帯": "http://wiki.ffo.jp/html/8665.html",
                        "闇輪の帯": "http://wiki.ffo.jp/html/8664.html", "セサンスピアス": "http://wiki.ffo.jp/html/34759.html", "イシュヴァラピアス": "http://wiki.ffo.jp/html/34141.html",
                        "ルフェセントリング": "http://wiki.ffo.jp/html/34716.html", "コーネリアリング": "http://wiki.ffo.jp/html/39077.html", "アキュメンリング": "http://wiki.ffo.jp/html/31381.html",
                        "オリハルブレット": "http://wiki.ffo.jp/html/25884.html", "テーオン装束": "http://wiki.ffo.jp/html/35660.html", "オショシ装束": "http://wiki.ffo.jp/html/36413.html",
                        "ヘルクリア装束": "http://wiki.ffo.jp/html/35458.html", "ラクサマナアタイア": "https://wiki.ffo.jp/html/30044.html", "デマサルデーゲン": "http://wiki.ffo.jp/html/33879.html",
                        "エルデションレンズ": "http://wiki.ffo.jp/html/33905.html", "フォシャゴルゲット": "http://wiki.ffo.jp/html/32703.html", "ガズブレスレット": "http://wiki.ffo.jp/html/35439.html",
                        "ハーバートンリング": "http://wiki.ffo.jp/html/32142.html", "イェマヤベルト": "http://wiki.ffo.jp/html/34152.html"
                    };
                    const keywords = ['武器メイン', 'サブ', '遠隔武器', '矢弾', '頭', '胴', '両手', '両脚', '両足', '首', '左耳', '右耳', '左手の指', '右手の指', '背', '腰'];

                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = contentDiv.innerHTML;
                    tempDiv.querySelectorAll('li').forEach(li => {
                        const txt = li.textContent.trim();
                        const colonIdx = txt.search(/[:：]/);
                        if (colonIdx !== -1 && keywords.some(k => txt.startsWith(k))) {
                            const prefix = txt.substring(0, colonIdx + 1) + ' ';
                            const restHtml = li.innerHTML.substring(li.innerHTML.search(/[:：]/) + 1).trim();
                            const items = restHtml.split(/\s+or\s+/).map(itemHtml => {
                                // すでにリンクが含まれている場合は、二重リンクを避けるためにラップしない
                                if (itemHtml.includes('<a ')) {
                                    return itemHtml; 
                                }

                                let baseName = itemHtml.replace(/<[^>]+>/g, '').replace(/[「」『』]/g, '').trim();
                                // カッコ・プラス以降を削除して検索用ベース名を作成
                                const searchName = baseName.split(/[（(＜<＋+]/)[0].trim();
                                
                                // 数値や記号のみ、英字1文字、または特定のキーワードの場合はリンクにしない
                                if (!searchName || /^[＋+or\d\sランクRankＡ-ＺA-Z]+$/.test(searchName) || searchName.includes('好きな武器')) {
                                    // ランク表記（＋４やＢなど）には装備品と同じ色を適用する
                                    if (/^[＋+or\d\sＡ-ＺA-Z]+$/.test(itemHtml)) {
                                        return `<span style="color:#a8e063;font-weight:700;">${itemHtml}</span>`;
                                    }
                                    return itemHtml;
                                }

                                // 略称変換（LA, CS, LK など）
                                let normalizedName = searchName;
                                const abbrMap = {
                                    'ＬＡ': 'ラヌン', 'LA': 'ラヌン',
                                    'ＣＳ': 'シャスー', 'CS': 'シャスー',
                                    'ＬＫ': 'ラクサマナ', 'LK': 'ラクサマナ',
                                    'ＬＵ': 'ルザフ', 'LU': 'ルザフ',
                                    'ＨＶ': 'ハーバートン', 'HV': 'ハーバートン'
                                };
                                for (let key in abbrMap) {
                                    if (normalizedName.startsWith(key)) {
                                        normalizedName = normalizedName.replace(key, abbrMap[key]);
                                        break;
                                    }
                                }

                                // ランク文字の削除
                                normalizedName = normalizedName.replace(/[Ａ-ＺA-Z]$/, '').trim();

                                // セット装備名の正規化
                                if (normalizedName.startsWith('ニャメ')) normalizedName = 'ニャメ装束';
                                else if (normalizedName.startsWith('イケンガ')) normalizedName = 'イケンガ装束';
                                else if (normalizedName.startsWith('マリグナス') && !normalizedName.includes('ピアス')) normalizedName = 'マリグナス装束';
                                else if (normalizedName.startsWith('ラヌン') && !normalizedName.includes('ナイフ')) normalizedName = 'ラヌンアタイア';
                                else if (normalizedName.startsWith('シャスー') && !normalizedName.includes('ピアス')) normalizedName = 'シャスーアタイア';
                                else if (normalizedName.startsWith('ラクサマナ')) normalizedName = 'ラクサマナアタイア';
                                else if (normalizedName.startsWith('ロスタム')) normalizedName = 'ロスタム';
                                else if (normalizedName.startsWith('アデマ')) normalizedName = 'アデマ装束';
                                else if (normalizedName.startsWith('テーオン')) normalizedName = 'テーオン装束';
                                else if (normalizedName.startsWith('ヘルクリア')) normalizedName = 'ヘルクリア装束';
                                else if (normalizedName.startsWith('オショシ')) normalizedName = 'オショシ装束';
                                else if (normalizedName.startsWith('ハーバートン')) normalizedName = 'ハーバートンリング';
                                else if (normalizedName.startsWith('ルザフ')) normalizedName = 'ルザフリング';

                                const url = linkMap[normalizedName] || `https://duckduckgo.com/?q=!ducky+site:wiki.ffo.jp+${encodeURIComponent(normalizedName)}`;
                                return `<a href="${url}" target="_blank" class="auto-link">${itemHtml}</a>`;
                            });
                            li.innerHTML = prefix + items.join(' or ');
                        }
                    });
                    contentDiv.innerHTML = tempDiv.innerHTML;

                    // 全てのリンクに target="_blank" を適用し、スタイルを一括管理
                    contentDiv.querySelectorAll('a').forEach(a => {
                        a.setAttribute('target', '_blank');
                        if (!a.classList.contains('auto-link')) {
                            // Markdown由来のリンクにもスタイルを適用
                            a.style.color = '#a8e063';
                            a.style.fontWeight = '700'; // 太さを強調
                            a.style.textDecoration = 'none';
                            a.style.borderBottom = '1px dashed #a8e063';
                        }
                    });

                    const tocList = document.getElementById('toc-list');
                    contentDiv.querySelectorAll('h2, h3').forEach((h, i) => {
                        h.id = 'h-' + i;
                        const tli = document.createElement('li');
                        tli.style.marginLeft = h.tagName === 'H3' ? '1rem' : '0';
                        tli.innerHTML = `<a href="#${h.id}">${h.textContent}</a>`;
                        tocList.appendChild(tli);
                    });
                })
                .catch(e => contentDiv.innerHTML = `<h2>Error</h2><p>${e}</p>`);
        }
    </script>
</body>
</html>
