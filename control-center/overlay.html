<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Chat Translator - OBS Overlay</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- 共通スタイルシート -->
    <link rel="stylesheet" href="app.css">
    <style>
        /* OBS透過用の特別設定 */
        html, body {
            background-color: transparent !important;
            background: transparent !important;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body class="overlay-body">

    <!-- コメントが追加されていくコンテナ -->
    <div id="comment-container"></div>

    <!-- 翻訳 ＆ アニメーション制御スクリプト -->
    <script src="overlay.js"></script>
</body>
</html>
