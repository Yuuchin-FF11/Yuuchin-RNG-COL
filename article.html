<!DOCTYPE html>
<html lang="ja">
<head>
    <!-- Google tag (gtag.js) -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記事 | FFXI Bismarck</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@300;400;500&family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .article-container { 
            margin-top: 120px; 
            margin-bottom: 100px; 
            max-width: 1550px; 
            margin-left: auto; 
            margin-right: auto;
            padding: 0 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .article-header-nav { width: 100%; max-width: 1100px; margin-bottom: 2rem; text-align: left; }
        .article-layout { display: flex; gap: 3rem; align-items: flex-start; justify-content: center; width: 100%; }
        .article-main { flex: 0 1 1100px; min-width: 0; width: 100%; }
        .article-card { padding: 3rem; }
        .toc-sidebar { width: 280px; position: sticky; top: 120px; background: var(--glass-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--glass-border); border-radius: 12px; padding: 1.5rem; display: none; }
        @media (min-width: 1024px) { .toc-sidebar { display: block; } }
        .toc-sidebar h4 { color: var(--accent-color); margin-bottom: 1rem; font-family: 'Noto Sans JP', sans-serif; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 { font-family: 'Zen Maru Gothic', sans-serif; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.5rem; }
        .toc-sidebar ul { list-style: none; padding-left: 0; }
        .toc-sidebar li { margin-bottom: 0.8rem; }
        .toc-sidebar a { color: var(--text-light); text-decoration: none; font-size: 0.95rem; transition: color 0.3s; }
        .toc-sidebar a:hover { color: var(--primary-color); }
        .footer-top-link { 
            position: fixed; bottom: 30px; right: 30px; color: var(--accent-color); text-decoration: none; 
            font-size: 0.95rem; font-weight: bold; transition: all 0.3s ease; display: flex; align-items: center; 
            gap: 0.5rem; background: rgba(13, 71, 161, 0.6); backdrop-filter: blur(10px); padding: 0.8rem 1.4rem; 
            border-radius: 30px; border: 1px solid var(--glass-border); z-index: 10000; opacity: 0; visibility: hidden;
            transform: translateY(20px);
        }
        .footer-top-link.visible { opacity: 1; visibility: visible; transform: translateY(0); }
        .back-btn { display: inline-block; color: var(--text-light); text-decoration: none; font-weight: bold; background: rgba(255, 255, 255, 0.1); padding: 0.8rem 1.5rem; border-radius: 30px; transition: all 0.3s ease; position: relative; z-index: 10; }
        .back-btn:hover { background: var(--primary-color); transform: translateX(-5px); }
        .markdown-body { color: var(--text-light); line-height: 1.8; padding: 1rem; font-family: 'Noto Sans JP', sans-serif; }
        .markdown-body h1 { color: var(--accent-color); font-size: 2.2rem; margin-bottom: 2rem; border-bottom: 2px solid var(--accent-color); }
        .markdown-body h2 { color: white; font-size: 1.6rem; margin-top: 2.5rem; border-left: 5px solid var(--primary-color); padding-left: 1rem; }
        .markdown-body h3 { color: var(--accent-color); font-size: 1.35rem; margin-top: 2.2rem; border-left: 4px solid var(--accent-color); padding-left: 0.8rem; text-shadow: 0 0 8px rgba(255, 215, 0, 0.2); }
        .markdown-body h4 { color: white; font-size: 1.1rem; margin-top: 1.8rem; margin-bottom: 0.8rem; font-family: 'Zen Maru Gothic', sans-serif; text-shadow: 0 0 5px rgba(255,255,255,0.1); }
        .markdown-body p, .markdown-body li { font-size: 1.1rem; margin-bottom: 1rem; }
        .markdown-body a { color: #a8e063; text-decoration: none; border-bottom: 1px dashed #a8e063; font-weight: 700; }
        .auto-link { color: #a8e063; font-weight: 700; text-decoration: none; border-bottom: 1px dashed #a8e063; }
        .highlight-bracket { color: #ffb700; font-weight: bold; text-shadow: 0 0 8px rgba(255, 183, 0, 0.2); }
        .markdown-body code {
            font-family: 'Noto Sans JP', 'Consolas', monospace;
            background: rgba(255, 255, 255, 0.08);
            color: #ffb700;
            padding: 0.15em 0.4em;
            border-radius: 4px;
            font-size: 0.95em;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div id="particle-canvas-container"></div>
    <header class="glass-header">
        <div class="logo"><a href="index.html" style="color: inherit; text-decoration: none;">FFXI Bismarck</a></div>
    </header>

    <main class="article-container">
        <div class="article-header-nav">
            <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> トップページへ戻る</a>
        </div>
        
        <div class="article-layout">
            <article class="article-main">
                <div class="glass-card article-card">
                    <div id="markdown-content" class="markdown-body">
                        <div style="text-align: center; padding: 3rem 0;"><i class="fa-solid fa-spinner fa-spin fa-3x" style="color: var(--accent-color);"></i><p>記事を読み込み中...</p></div>
                    </div>
                </div>
            </article>

            <aside class="toc-sidebar" id="toc-sidebar">
                <h4 style="margin-top:0;"><i class="fa-solid fa-list"></i> 目次</h4>
                <ul id="toc-list"></ul>
            </aside>
        </div>
    </main>

    <footer class="glass-footer">
        <div class="container" style="text-align: center;">
            <p>&copy; 2026 Tarutaru Fan Site. Not affiliated with SQUARE ENIX.</p>
        </div>
    </footer>

    <a href="#" id="fixed-back-to-top" class="footer-top-link"><i class="fa-solid fa-chevron-up"></i> ページの一番上へ</a>

    <script type="module">
        import { linkMap, keywordsJa, normalizeEquipmentName } from './画像素材/js/link_map.js';

        const urlParams = new URLSearchParams(window.location.search);
        const file = urlParams.get('file');
        const contentDiv = document.getElementById('markdown-content');

        // 全キーワードを長さ順にソートし、一括検索用の正規表現を作成（高速化）
        const sortedKeys = Object.keys(linkMap).sort((a, b) => b.length - a.length);
        const escapedKeys = sortedKeys.map(k => k.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&'));
        const autoLinkRegex = new RegExp(`(${escapedKeys.join('|')})`, 'g');

        if (file) {
            fetch(file + '?t=' + new Date().getTime())
                .then(r => r.ok ? r.text() : Promise.reject('File not found'))
                .then(text => {
                    // 先にMarkdownをパースすることで**太字**を確定させ、生の**マークの露出を防ぎます！
                    let parsedHtml = marked.parse(text);
                    if (typeof parsedHtml === 'string') {
                        // マークダウン内の画像相対パス「../画像素材/」を、HTML読み込み時の「画像素材/」に自動置換して画像切れを防止🐾
                        parsedHtml = parsedHtml.replace(/\.\.\/画像素材\//g, '画像素材/');
                    }
                    // HTMLタグを破壊しないように配慮しながら「」『』のイエローゴールド強調置換を実行
                    const processedText = (typeof parsedHtml === 'string') ? parsedHtml.replace(/([「『])([^」』\n<>]+)([」』])/g, '<span class="highlight-bracket">$1$2$3</span>') : parsedHtml;
                    contentDiv.innerHTML = processedText;

                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = contentDiv.innerHTML;
                    
                    // リスト(li)内の装備名リンク化処理
                    tempDiv.querySelectorAll('li').forEach(li => {
                        const txt = li.textContent.trim();
                        const colonIdx = txt.search(/[:：]/);
                        if (colonIdx !== -1 && keywordsJa.some(k => txt.startsWith(k))) {
                            const prefix = txt.substring(0, colonIdx + 1) + ' ';
                            const restHtml = li.innerHTML.substring(li.innerHTML.search(/[:：]/) + 1).trim();
                            const items = restHtml.split(/\s+(?:or|または)\s+/).map(itemHtml => {
                                // すでにリンクが含まれている場合は、二重リンクを避けるためにラップしない
                                if (itemHtml.includes('<a ')) {
                                    return itemHtml.replace(/(<\/a>)\s*([（(][^）)]+[）)])/g, '$1<span style="color:#a8e063;font-weight:700;">$2</span>');
                                }

                                let baseName = itemHtml.replace(/<[^>]+>/g, '').replace(/[「」『』]/g, '').trim();
                                const searchName = baseName.split(/[（(＜<＋+]/)[0].trim();
                                
                                if (!searchName || /^[＋+or\d\sランクRankＡ-ＺA-Z]+$/.test(searchName) || searchName.includes('好きな武器') || searchName.includes('好きな装備') || searchName.includes('その他の')) {
                                    if (/^[＋+or\d\sＡ-ＺA-Z]+$/.test(itemHtml) || itemHtml.includes('好きな') || itemHtml.includes('その他の')) {
                                        return `<span style="color:#a8e063;font-weight:700;">${itemHtml}</span>`;
                                    }
                                    return itemHtml;
                                }

                                const normalizedName = normalizeEquipmentName(searchName, false);
                                const url = linkMap[normalizedName];
                                if (url) {
                                    return `<a href="${url}" target="_blank" class="auto-link">${itemHtml}</a>`;
                                } else {
                                    if (/^[＋+or\d\sＡ-ＺA-Z]+$/.test(itemHtml) || itemHtml.includes('好きな') || itemHtml.includes('その他の')) {
                                        return `<span style="color:#a8e063;font-weight:700;">${itemHtml}</span>`;
                                    }
                                    return itemHtml;
                                }
                            });
                            li.innerHTML = prefix + items.join(' or ');
                        }
                    });

                    // テーブルセル(td)内の装備名リンク化処理
                    tempDiv.querySelectorAll('td').forEach(td => {
                        if (td.querySelector('a')) return;

                        let baseHtml = td.innerHTML.trim();
                        let baseName = td.textContent.trim();
                        const searchName = baseName.split(/[（(＜<＋+]/)[0].trim();
                        
                        if (!searchName || /^[＋+or\d\sランクRankＡ-ＺA-Z]+$/.test(searchName) || searchName.includes('好きな武器') || searchName.includes('好きな装備') || searchName.includes('その他の')) {
                            if (/^[＋+or\d\sＡ-ＺA-Z]+$/.test(baseHtml) || baseHtml.includes('好きな') || baseHtml.includes('その他の')) {
                                td.innerHTML = `<span style="color:#a8e063;font-weight:700;">${baseHtml}</span>`;
                            }
                            return;
                        }

                        const normalizedName = normalizeEquipmentName(searchName, false);
                        const url = linkMap[normalizedName];
                        if (url) {
                            td.innerHTML = `<a href="${url}" target="_blank" class="auto-link">${baseHtml}</a>`;
                        } else {
                            if (/^[＋+or\d\sＡ-ＺA-Z]+$/.test(baseHtml) || baseHtml.includes('好きな') || baseHtml.includes('その他の')) {
                                td.innerHTML = `<span style="color:#a8e063;font-weight:700;">${baseHtml}</span>`;
                            }
                        }
                    });

                    // プレミアム拡張：通常の文章内のキーワードを用語辞典へ自動リンク化（正規表現による超高速置換）
                    const autoLinkTextNodes = (node) => {
                        if (node.nodeType === Node.TEXT_NODE) {
                            const text = node.textContent;
                            if (autoLinkRegex.test(text)) {
                                autoLinkRegex.lastIndex = 0; // RegExpのインデックスをリセット
                                const parent = node.parentNode;
                                const tempSpan = document.createElement('span');
                                tempSpan.innerHTML = text.replace(autoLinkRegex, (match) => {
                                    const normalizedName = normalizeEquipmentName(match, false);
                                    const url = linkMap[normalizedName];
                                    if (url) {
                                        return `<a href="${url}" target="_blank" class="auto-link">${match}</a>`;
                                    }
                                    return match;
                                });
                                
                                // tempSpan の子ノードを元のテキストノードの場所に挿入
                                while (tempSpan.firstChild) {
                                    parent.insertBefore(tempSpan.firstChild, node);
                                }
                                parent.removeChild(node);
                            }
                        } else if (node.nodeType === Node.ELEMENT_NODE) {
                            if (node.tagName !== 'A' && node.tagName !== 'PRE' && node.tagName !== 'CODE' && node.tagName !== 'SCRIPT' && node.tagName !== 'STYLE') {
                                const children = Array.from(node.childNodes);
                                children.forEach(child => autoLinkTextNodes(child));
                            }
                        }
                    };
                    autoLinkTextNodes(tempDiv);

                    contentDiv.innerHTML = tempDiv.innerHTML;

                    // リンクの挙動を調整（外部サイトは別タブ、サイト内は同タブ）
                    contentDiv.querySelectorAll('a').forEach(a => {
                        const isExternal = a.hostname && a.hostname !== window.location.hostname;
                        if (isExternal || (a.href.startsWith('http') && !a.href.includes(window.location.hostname))) {
                            a.setAttribute('target', '_blank');
                            a.rel = 'noopener noreferrer';
                        } else {
                            a.setAttribute('target', '_self');
                        }

                        if (!a.classList.contains('auto-link')) {
                            // Markdown由来のリンクにもスタイルを適用
                            a.style.color = '#a8e063';
                            a.style.fontWeight = '700';
                            a.style.textDecoration = 'none';
                            a.style.borderBottom = '1px dashed #a8e063';
                        }
                    });

                    const tocList = document.getElementById('toc-list');
                    contentDiv.querySelectorAll('h2, h3').forEach((h, i) => {
                         h.id = 'h-' + i;
                         const tli = document.createElement('li');
                         tli.style.marginLeft = h.tagName === 'H3' ? '1rem' : '0';
                         tli.innerHTML = `<a href="#${h.id}">${h.textContent}</a>`;
                         tocList.appendChild(tli);
                     });
 
                     // ハッシュがある場合は、レンダリング後にその位置までスクロール
                     if (window.location.hash) {
                         setTimeout(() => {
                             const id = window.location.hash.substring(1);
                             const target = document.getElementById(id);
                             if (target) {
                                 target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                             }
                         }, 100);
                     }
 
                 })
                 .catch(e => contentDiv.innerHTML = `<h2>Error</h2><p>${e}</p>`);
         }

         const backToTopBtn = document.getElementById('fixed-back-to-top');
         if (backToTopBtn) {
             window.addEventListener('scroll', () => {
                const scrolled = window.pageYOffset || document.documentElement.scrollTop;
                if (scrolled > 400) {
                    backToTopBtn.classList.add('visible');
                    backToTopBtn.style.opacity = '1';
                    backToTopBtn.style.visibility = 'visible';
                    backToTopBtn.style.transform = 'translateY(0)';
                } else {
                    backToTopBtn.classList.remove('visible');
                    backToTopBtn.style.opacity = '0';
                    backToTopBtn.style.visibility = 'hidden';
                    backToTopBtn.style.transform = 'translateY(20px)';
                }
            }, { passive: true });
             backToTopBtn.addEventListener('click', (e) => {
                 e.preventDefault();
                 window.scrollTo({ top: 0, behavior: 'smooth' });
             });
         }
     </script>

</body>
</html>
