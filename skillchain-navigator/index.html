<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFXI 連携逆引きシミュレーター</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>FFXI 連携逆引きシミュレーター</h1>
            <p>使用する「2つの武器種」と「狙いたい連携」を選ぶだけで、最適なWSの組み合わせを一瞬で逆引き探索します 🐾</p>
        </header>

        <main class="main-card glass-card">
            <div class="form-grid">
                <!-- 武器1 -->
                <div class="form-group">
                    <label for="weapon-1">1段目の武器種 (トス側)</label>
                    <select id="weapon-1">
                        <option value="HandToHand">格闘 (Hand-to-Hand)</option>
                        <option value="Dagger">短剣 (Dagger)</option>
                        <option value="Sword" selected>片手剣 (Sword)</option>
                        <option value="GreatSword">両手剣 (Great Sword)</option>
                        <option value="Axe">片手斧 (Axe)</option>
                        <option value="GreatAxe">両手斧 (Great Axe)</option>
                        <option value="Scythe">両手鎌 (Scythe)</option>
                        <option value="Polearm">両手槍 (Polearm)</option>
                        <option value="Katana">片手刀 (Katana)</option>
                        <option value="GreatKatana">両手刀 (Great Katana)</option>
                        <option value="Club">片手棍 (Club)</option>
                        <option value="Staff">両手棍 (Staff)</option>
                        <option value="Bow">弓術 (Bow)</option>
                        <option value="Marksmanship">射撃 (Marksmanship)</option>
                    </select>
                </div>

                <!-- 武器2 -->
                <div class="form-group">
                    <label for="weapon-2">2段目の武器種 (〆側)</label>
                    <select id="weapon-2">
                        <option value="HandToHand">格闘 (Hand-to-Hand)</option>
                        <option value="Dagger" selected>短剣 (Dagger)</option>
                        <option value="Sword">片手剣 (Sword)</option>
                        <option value="GreatSword">両手剣 (Great Sword)</option>
                        <option value="Axe">片手斧 (Axe)</option>
                        <option value="GreatAxe">両手斧 (Great Axe)</option>
                        <option value="Scythe">両手鎌 (Scythe)</option>
                        <option value="Polearm">両手槍 (Polearm)</option>
                        <option value="Katana">片手刀 (Katana)</option>
                        <option value="GreatKatana">両手刀 (Great Katana)</option>
                        <option value="Club">片手棍 (Club)</option>
                        <option value="Staff">両手棍 (Staff)</option>
                        <option value="Bow">弓術 (Bow)</option>
                        <option value="Marksmanship">射撃 (Marksmanship)</option>
                    </select>
                </div>

                <!-- 狙う連携 -->
                <div class="form-group">
                    <label for="target-chain">狙いたい連携属性</label>
                    <select id="target-chain">
                        <option value="ANY" selected>すべての連携を表示</option>
                        <option value="極光">【イオAM限定】極光 (Lv4) ［光 ＋ 光（AM中）］</option>
                        <option value="黒闇">【イオAM限定】極闇/黒闇 (Lv4) ［闇 ＋ 闇（AM中）］</option>
                        <option value="光">光 (Lv3) ［核熱 ＋ 湾曲 / 湾曲 ＋ 核熱］</option>
                        <option value="闇">闇 (Lv3) ［重力 ＋ 分解 / 分解 ＋ 重力］</option>
                        <option value="分解">分解 (Lv2) ［貫通 ＋ 切断 / 収縮 ＋ 貫通］</option>
                        <option value="湾曲">湾曲 (Lv2) ［振動 ＋ 貫通 / 収縮 ＋ 振動］</option>
                        <option value="重力">重力 (Lv2) ［炸裂 ＋ 収縮 / 切断 ＋ 収縮］</option>
                        <option value="核熱">核熱 (Lv2) ［溶解 ＋ 衝撃 / 衝撃 ＋ 溶解］</option>
                        <option value="Lv1">すべてのLv1連携 (溶解、切断、炸裂、振動、貫通、衝撃、収縮等)</option>
                    </select>
                </div>

            </div>

            <div class="action-area">
                <button id="btn-search" class="btn btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    連携ルートを探索する
                </button>
            </div>
        </main>

        <!-- 結果表示エリア -->
        <section class="results-section">
            <h2 class="section-title">探索結果 <span id="result-count" class="badge">0件</span></h2>
            <div id="results-list" class="results-grid">
                <!-- 動的に結果カードが追加されます -->
            </div>
            <div id="no-results" class="glass-card empty-state" style="display: none;">
                選択された組み合わせで、狙った連携を発生させるルートは見つかりませんでした。別の連携属性や武器種をお試しください🐾
            </div>
        </section>

        <footer class="footer-info">
            <p>&copy; Yuuchin FFXI Utility | Developed by Antigravity 🐾</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
