<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF風レベルアップ効果音 - 黄金比テンポ・テストルーム（Ver 7.0）🐾</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #06040d;
            --accent-color: #eab308;
            --accent-glow: rgba(234, 179, 8, 0.3);
            --text-color: #f8fafc;
        }
        body {
            font-family: 'Outfit', 'Noto Sans JP', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(circle at center, #1e1b4b, #090514, #020005);
        }
        .container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(234, 179, 8, 0.15);
            border-radius: 24px;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            max-width: 480px;
            width: 100%;
        }
        h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fef08a 0%, #eab308 50%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            text-shadow: 0 0 30px rgba(234, 179, 8, 0.2);
        }
        p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }
        .btn-play {
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            color: #000;
            border: none;
            padding: 1.25rem 2.5rem;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(234, 179, 8, 0.4);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
        }
        .btn-play:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 0 30px rgba(234, 179, 8, 0.6);
        }
        .btn-play:active {
            transform: translateY(0) scale(1);
        }
        .footer-note {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>LEVEL UP! - Ver 7.0 🐾</h1>
        <p>
            ご主人様（Yuuchin様）こだわりの調律が完了！遅すぎたテンポをほんの少しだけスピードアップし、黄金のバランス比率「0.178秒」へ再微調整！躍動感と重厚感の両立を極限まで突き詰めた、神クオリティのファンファーレです🐾
        </p>
        <button class="btn-play" onclick="playFanfare()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            黄金のファンファーレを聴く 🎺
        </button>
        <div class="footer-note">
            ※躍動感と重厚感を完璧に両立させた、黄金比テンポの生ブラス音です。
        </div>
    </div>

    <script>
        // スネアドラムロール用のノイズバッファ生成
        function createNoiseBuffer(audioCtx) {
            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            return buffer;
        }

        // 軍楽隊スネアドラムのロール音合成
        function playSnareRoll(audioCtx, startTime, duration) {
            const noise = audioCtx.createBufferSource();
            noise.buffer = createNoiseBuffer(audioCtx);
            
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(1050, startTime);
            filter.Q.setValueAtTime(1.5, startTime);
            
            const gainNode = audioCtx.createGain();
            
            gainNode.gain.setValueAtTime(0.018, startTime);
            const rolls = 45;
            for (let i = 0; i < rolls; i++) {
                const t = startTime + (duration * i / rolls);
                const vol = 0.01 + Math.sin(i * 1.5) * 0.007;
                gainNode.gain.setValueAtTime(vol, t);
            }
            gainNode.gain.setValueAtTime(0.022, startTime + duration - 0.05);
            gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
            
            noise.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            noise.start(startTime);
            noise.stop(startTime + duration);
        }

        // ラッパ（金管楽器トランペット）の物理シミュレーション合成
        function playBrassNote(audioCtx, freq, startTime, duration, isFinal = false) {
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const filter = audioCtx.createBiquadFilter();
            const gainNode = audioCtx.createGain();
            
            osc1.type = 'sawtooth';
            osc2.type = 'sawtooth';
            
            osc1.frequency.setValueAtTime(freq, startTime);
            osc2.frequency.setValueAtTime(freq, startTime);
            
            // ラッパ隊の厚みを出すデチューン
            osc1.detune.setValueAtTime(-9, startTime); 
            osc2.detune.setValueAtTime(9, startTime);  
            
            // ビブラート（息の揺れ：6.5Hz）
            const lfo = audioCtx.createOscillator();
            const lfoGain = audioCtx.createGain();
            lfo.type = 'sine';
            lfo.frequency.setValueAtTime(6.5, startTime);
            lfoGain.gain.setValueAtTime(isFinal ? 10 : 5, startTime);
            
            lfo.connect(lfoGain);
            lfoGain.connect(osc1.frequency);
            lfoGain.connect(osc2.frequency);
            
            // 吹き込みアタック時のフィルタースイープ
            filter.type = 'lowpass';
            filter.Q.setValueAtTime(2.2, startTime);
            filter.frequency.setValueAtTime(350, startTime);
            filter.frequency.exponentialRampToValueAtTime(3200, startTime + 0.08);
            filter.frequency.setValueAtTime(2800, startTime + duration - 0.06);
            filter.frequency.exponentialRampToValueAtTime(350, startTime + duration);
            
            // 音量エンベロープ
            gainNode.gain.setValueAtTime(0.0, startTime);
            gainNode.gain.linearRampToValueAtTime(0.065, startTime + 0.025);
            gainNode.gain.setValueAtTime(0.065, startTime + duration - 0.05);
            gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
            
            // 接続
            osc1.connect(filter);
            osc2.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            lfo.start(startTime);
            osc1.start(startTime);
            osc2.start(startTime);
            
            lfo.stop(startTime + duration);
            osc1.stop(startTime + duration);
            osc2.stop(startTime + duration);
        }

        function playFanfare() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const audioCtx = new AudioContext();
            const now = audioCtx.currentTime;
            
            // 【黄金比の調律】遅すぎたテンポをほんの少しだけスピードアップし、
            // 躍動感と重厚感が完璧に両立する「0.178秒」を新規適用！
            const tempo = 0.178; 
            
            // スネアドラムロールの起動
            playSnareRoll(audioCtx, now, tempo * 20);
            
            // 【完璧耳コピリズム ＆ リタルダンド減速・大余韻設計】：
            // タタタターン ターター タッタターン
            const notes = [
                // 1. タ
                { m: 523.25, h: [392.00, 261.63], t: 0, d: 0.7, f: false },
                // 2. タ
                { m: 523.25, h: [392.00, 261.63], t: 0.8, d: 0.7, f: false },
                // 3. タ
                { m: 523.25, h: [392.00, 261.63], t: 1.6, d: 0.7, f: false },
                // 4. ターン！ (ここまでタタタターン。テンポは基本に忠実に)
                { m: 523.25, h: [392.00, 261.63], t: 2.4, d: 2.2, f: false },
                
                // 5. ター（Ab4 = 415.30Hz）
                { m: 415.30, h: [311.13, 207.65], t: 5.2, d: 1.8, f: false },
                // 6. ター（Bb4 = 466.16Hz）
                { m: 466.16, h: [349.23, 233.08], t: 7.2, d: 1.8, f: false },
                
                // 【ここから劇的なリタルダンド（だんだん遅く）】
                // 7. タッ（C5 = 523.25Hz）
                { m: 523.25, h: [392.00, 261.63], t: 9.2, d: 1.5, f: false },
                // 8. タ（Bb4 = 466.16Hz）
                { m: 466.16, h: [349.23, 233.08], t: 11.0, d: 0.9, f: false },
                // 9. ターン！（C5 = 523.25Hz で完全解決＆7.0拍分の圧倒的な大余韻ブラスフィナーレ！）
                { m: 523.25, h: [392.00, 261.63], t: 12.2, d: 7.0, f: true }
            ];

            notes.forEach(note => {
                const startTime = now + note.t * tempo;
                const duration = note.d * tempo;
                
                // メロディライン
                playBrassNote(audioCtx, note.m, startTime, duration, note.f);
                
                // ハーモニーライン
                note.h.forEach(freq => {
                    playBrassNote(audioCtx, freq, startTime, duration, note.f);
                });
            });
        }
    </script>
</body>
</html>
