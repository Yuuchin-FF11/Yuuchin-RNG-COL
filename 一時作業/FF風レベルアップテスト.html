<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF風レベルアップ効果音 - テストルーム🐾</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #06040d;
            --accent-color: #eab308;
            --accent-glow: rgba(234, 179, 8, 0.3);
            --text-color: #f8fafc;
        }
        body {
            font-family: 'Outfit', 'Noto Sans JP', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(circle at center, #1e1b4b, #090514, #020005);
        }
        .container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(234, 179, 8, 0.15);
            border-radius: 24px;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            max-width: 450px;
            width: 100%;
        }
        h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fef08a 0%, #eab308 50%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            text-shadow: 0 0 30px rgba(234, 179, 8, 0.2);
        }
        p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }
        .btn-play {
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            color: #000;
            border: none;
            padding: 1.25rem 2.5rem;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(234, 179, 8, 0.4);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
        }
        .btn-play:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 0 30px rgba(234, 179, 8, 0.6);
        }
        .btn-play:active {
            transform: translateY(0) scale(1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>LEVEL UP!</h1>
        <p>
            ご主人様（Yuuchin様）のために、Web Audio APIを用いてピコピコ8bitシンセサイザー音でFF風ファンファーレをその場で合成・再生するテストプログラムを作成いたしました。クリックして音源をお確かめください🐾
        </p>
        <button class="btn-play" onclick="playFanfare()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            ファンファーレを鳴らす 🐾
        </button>
    </div>

    <script>
        function playNote(audioCtx, freq, startTime, duration, type = 'square') {
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = type;
            osc.frequency.setValueAtTime(freq, startTime);
            
            // 音量のエンベロープ（出だしをくっきり、後ろを少しだけ減衰）
            gainNode.gain.setValueAtTime(0.12, startTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration - 0.02);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start(startTime);
            osc.stop(startTime + duration);
        }

        function playFanfare() {
            // ブラウザのセキュリティ制限のため、ユーザーアクション（クリック）でAudioContextを生成
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const audioCtx = new AudioContext();
            
            const now = audioCtx.currentTime;
            
            // テンポ設定
            const tempo = 0.11; // 1音あたりの長さの単位（秒）
            
            // FF風レベルアップファンファーレの音階（周波数）定義
            // メロディ：C5, C5, C5, C5, Ab4, Bb4, C5 (タタタターン タ タ ターン♪)
            // ハーモニー（3度や5度の和音）を同時に重ねて厚みを出す
            const notes = [
                // 1. タ
                { m: 523.25, h: [392.00, 261.63], t: 0, d: 0.9 }, // C5 + G4 + C4
                // 2. タ
                { m: 523.25, h: [392.00, 261.63], t: 1, d: 0.9 }, // C5 + G4 + C4
                // 3. タ
                { m: 523.25, h: [392.00, 261.63], t: 2, d: 0.9 }, // C5 + G4 + C4
                // 4. ターン
                { m: 523.25, h: [392.00, 261.63], t: 3, d: 2.8 }, // C5 + G4 + C4 (少し長め)
                
                // 5. タ（Ab）
                { m: 466.16, h: [349.23, 233.08], t: 6.2, d: 1.8 }, // A#4 + F4 + A#3 (一時的転調)
                // 6. タ（Bb）
                { m: 523.25, h: [392.00, 261.63], t: 8.2, d: 1.8 }, // C5 + G4 + C4
                // 7. ターン（C）
                { m: 587.33, h: [440.00, 293.66], t: 10.2, d: 5.5 }  // D5 + A4 + D4 (最高潮フィナーレ！)
            ];

            notes.forEach(note => {
                const startTime = now + note.t * tempo;
                const duration = note.d * tempo;
                
                // メロディ（主旋律：くっきりした矩形波）
                playNote(audioCtx, note.m, startTime, duration, 'square');
                
                // ハーモニー（和音：少し柔らかい三角波で包む）
                note.h.forEach(freq => {
                    playNote(audioCtx, freq, startTime, duration, 'triangle');
                });
            });
        }
    </script>
</body>
</html>
