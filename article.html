<!DOCTYPE html>
<html lang="ja">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KD054RHKQ8"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-KD054RHKQ8');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記事 | FFXI Bismarck</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@300;400;500&family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .article-layout { display: flex; gap: 2rem; align-items: flex-start; }
        .article-main { flex: 1; min-width: 0; }
        .toc-sidebar { width: 250px; position: sticky; top: 120px; background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); border-radius: 12px; padding: 1.5rem; display: none; }
        @media (min-width: 1024px) { .toc-sidebar { display: block; } }
        .toc-sidebar h4 { color: var(--accent-color); margin-bottom: 1rem; font-family: 'Noto Sans JP', sans-serif; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 { font-family: 'Zen Maru Gothic', sans-serif; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.5rem; }
        .toc-sidebar ul { list-style: none; padding-left: 0; }
        .toc-sidebar li { margin-bottom: 0.8rem; }
        .toc-sidebar a { color: var(--text-light); text-decoration: none; font-size: 0.95rem; transition: color 0.3s; }
        .toc-sidebar a:hover { color: var(--primary-color); }
        #back-to-top { position: fixed; bottom: 30px; right: 30px; width: 50px; height: 50px; border-radius: 50%; background: var(--primary-color); color: #111; border: none; font-size: 1.5rem; cursor: pointer; display: none; justify-content: center; align-items: center; z-index: 1000; }
        .article-container { margin-top: 120px; margin-bottom: 100px; max-width: 900px; }
        .back-btn { display: inline-block; margin-bottom: 2rem; color: var(--text-light); text-decoration: none; font-weight: bold; background: rgba(255, 255, 255, 0.1); padding: 0.8rem 1.5rem; border-radius: 30px; }
        .markdown-body { color: var(--text-light); line-height: 1.8; padding: 1rem; font-family: 'Noto Sans JP', sans-serif; }
        .markdown-body h1 { color: var(--accent-color); font-size: 2.2rem; margin-bottom: 2rem; border-bottom: 2px solid var(--accent-color); }
        .markdown-body h2 { color: white; font-size: 1.6rem; margin-top: 2.5rem; border-left: 5px solid var(--primary-color); padding-left: 1rem; }
        .markdown-body p, .markdown-body li { font-size: 1.1rem; margin-bottom: 1rem; }
        .markdown-body a { color: #a8e063; text-decoration: underline; }
        .highlight-bracket { color: #ffb700; font-weight: bold; text-shadow: 0 0 8px rgba(255, 183, 0, 0.2); }
    </style>
</head>
<body>
    <div id="particle-canvas-container"></div>
    <header class="glass-header">
        <div class="logo"><a href="index.html" style="color: inherit; text-decoration: none;">FFXI Bismarck</a></div>
    </header>

    <main class="container article-container">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> トップページへ戻る</a>
        <div class="article-layout">
            <div class="article-main">
                <div class="glass-card" style="padding: 2rem 3rem;">
                    <div id="markdown-content" class="markdown-body">
                        <div style="text-align: center; padding: 3rem 0;"><i class="fa-solid fa-spinner fa-spin fa-3x" style="color: var(--accent-color);"></i><p>記事を読み込み中...</p></div>
                    </div>
                </div>
            </div>
            <aside class="toc-sidebar" id="toc-sidebar"><h4 style="margin-top:0;"><i class="fa-solid fa-list"></i> 目次</h4><ul id="toc-list"></ul></aside>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const file = urlParams.get('file');
        const contentDiv = document.getElementById('markdown-content');

        if (file) {
            fetch(file)
                .then(r => r.ok ? r.text() : Promise.reject('File not found'))
                .then(text => {
                    const rawHtml = marked.parse(text);
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = rawHtml;

                    // 装備リンク設定
                    const linkMap = {
                        "ロスタム": "http://wiki.ffo.jp/html/37235.html", "ニャメ装束": "http://wiki.ffo.jp/html/38283.html", "マリグナス装束": "http://wiki.ffo.jp/html/39726.html",
                        "イケンガ装束": "http://wiki.ffo.jp/html/38196.html", "シャスーアタイア": "http://wiki.ffo.jp/html/33205.html", "ラヌンアタイア": "http://wiki.ffo.jp/html/30924.html",
                        "アデマ装束": "http://wiki.ffo.jp/html/34613.html", "テーオン装束": "http://wiki.ffo.jp/html/35660.html", "ネイグリング": "http://wiki.ffo.jp/html/37597.html",
                        "トーレット": "http://wiki.ffo.jp/html/37598.html", "サンダン": "http://wiki.ffo.jp/html/34652.html", "ムンム装束": "http://wiki.ffo.jp/html/34947.html", "アヤモ装束": "http://wiki.ffo.jp/html/35165.html",
                        "フォーマルハウト": "http://wiki.ffo.jp/html/35356.html", "デスペナルティ": "http://wiki.ffo.jp/html/483.html", "カムラスマント": "http://wiki.ffo.jp/html/35517.html"
                    };
                    const keywords = ['武器メイン', 'サブ', '遠隔武器', '矢弾', '頭', '胴', '両手', '両脚', '両足', '首', '左耳', '右耳', '左手の指', '右手の指', '背', '腰'];

                    // 裏側で一括処理
                    tempDiv.querySelectorAll('li').forEach(li => {
                        const txt = li.textContent.trim();
                        const colonIdx = txt.indexOf(':');
                        if (colonIdx !== -1 && keywords.includes(txt.substring(0, colonIdx))) {
                            const prefix = txt.substring(0, colonIdx + 1) + ' ';
                            const rest = txt.substring(colonIdx + 1).trim();
                            const items = rest.split(/\s+or\s+/).map(item => {
                                // 装備名の抽出ロジック（タグとカッコを除去）
                                let baseName = item.replace(/<[^>]+>/g, '').replace(/[「」『』]/g, '').split(/[（(<+]/)[0].trim();
                                
                                // 略称や部位名の正規化
                                if (baseName.startsWith('ニャメ')) baseName = 'ニャメ装束';
                                else if (baseName.startsWith('マリグナス') && !baseName.includes('ピアス')) baseName = 'マリグナス装束';
                                else if (baseName.startsWith('ラヌン')) baseName = 'ラヌンアタイア';
                                else if (baseName.startsWith('シャスー')) baseName = 'シャスーアタイア';
                                
                                const url = linkMap[baseName] || `https://duckduckgo.com/?q=!ducky+site:wiki.ffo.jp+${encodeURIComponent(baseName)}`;
                                return `<a href="${url}" target="_blank" style="color:#a8e063;font-weight:bold;text-decoration:none;border-bottom:1px dashed #a8e063;">${item}</a>`;
                            });
                            li.innerHTML = prefix + items.join(' or ');
                        } else {
                            li.innerHTML = li.innerHTML.replace(/([「『])([^」』]+)([」』])/g, '<span class="highlight-bracket">$1$2$3</span>');
                        }
                    });

                    tempDiv.querySelectorAll('p, blockquote, h2, h3').forEach(el => {
                        el.innerHTML = el.innerHTML.replace(/([「『])([^」』]+)([」』])/g, '<span class="highlight-bracket">$1$2$3</span>');
                    });

                    // 最後に一回だけ画面を更新
                    contentDiv.innerHTML = tempDiv.innerHTML;

                    // 目次生成
                    const tocList = document.getElementById('toc-list');
                    contentDiv.querySelectorAll('h2, h3').forEach((h, i) => {
                        h.id = 'h-' + i;
                        const tli = document.createElement('li');
                        tli.style.marginLeft = h.tagName === 'H3' ? '1rem' : '0';
                        tli.innerHTML = `<a href="#${h.id}">${h.textContent}</a>`;
                        tocList.appendChild(tli);
                    });
                })
                .catch(e => contentDiv.innerHTML = `<h2>Error</h2><p>${e}</p>`);
        }
    </script>
</body>
</html>
