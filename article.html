        .article-container { 
            margin-top: 120px;

    <a href="#" id="fixed-back-to-top" class="footer-top-link"><i class="fa-solid fa-chevron-up"></i> ページの一番上へ</a>

    <!-- Supabase CDN の読み込み🐾 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import { linkMap, keywordsJa, normalizeEquipmentName } from './画像素材/js/link_map.js';
        import { SUPABASE_URL, SUPABASE_ANON_KEY } from './画像素材/js/supabase_config.js';
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbx3tcuuAdd0KlOq35qv1lPbqUx3kI064F2_VBohfRdg9OZUYUwT-q6tdqgiPfe-K3dCQw/exec";

        const urlParams = new URLSearchParams(window.location.search);
        const file = urlParams.get('file');
        const contentDiv = document.getElementById('markdown-content');

        // 全キーワードを長さ順にソートし、一括検索用の正規表現を作成（高速化）
        const sortedKeys = Object.keys(linkMap).sort((a, b) => b.length - a.length);
        const escapedKeys = sortedKeys.map(k => k.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&'));
        const autoLinkRegex = new RegExp(`(${escapedKeys.join('|')})`, 'g');

        if (file) {
            fetch(file + '?t=' + new Date().getTime())
                .then(r => r.ok ? r.text() : Promise.reject('File not found'))
                .then(text => {
                    // 先にMarkdownをパースすることで**太字**を確定させ、生の**マークの露出を防ぎます！
                    let parsedHtml = marked.parse(text);
                    if (typeof parsedHtml === 'string') {
                        // マークダウン内の画像相対パス「../画像素材/」を、HTML読み込み時の「画像素材/」に自動置換して画像切れを防止🐾
                        parsedHtml = parsedHtml.replace(/\.\.\/画像素材\//g, '画像素材/');
                    }
                    // HTMLタグを破壊しないように配慮しながら「」『』のイエローゴールド強調置換を実行
                    const processedText = (typeof parsedHtml === 'string') ? parsedHtml.replace(/([「『])([^」』\n<>]+)([」』])/g, '<span class="highlight-bracket">$1$2$3</span>') : parsedHtml;
                    contentDiv.innerHTML = processedText;

                    // 記事のタイトル（最初の h1）をブラウザタイトルに動的設定🐾
                    const firstH1 = contentDiv.querySelector('h1');
                    if (firstH1) {
                        document.title = firstH1.textContent + ' | FFXI Bismarck';
                    }

                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = contentDiv.innerHTML;
                    
                    // リスト(li)内の装備名リンク化処理
                    tempDiv.querySelectorAll('li').forEach(li => {
                        const txt = li.textContent.trim();
                        const colonIdx = txt.search(/[:：]/);
                        if (colonIdx !== -1 && keywordsJa.some(k => txt.startsWith(k))) {
                            const prefix = txt.substring(0, colonIdx + 1) + ' ';
                            const restHtml = li.innerHTML.substring(li.innerHTML.search(/[:：]/) + 1).trim();
                            const items = restHtml.split(/\s+(?:or|または)\s+/).map(itemHtml => {
                                // すでにリンクが含まれている場合は、二重リンクを避けるためにラップしない
                                if (itemHtml.includes('<a ')) {
                                    return itemHtml.replace(/(<\/a>)\s*([（(][^）)]+[）)])/g, '$1<span style="color:#a8e063;font-weight:700;">$2</span>');
                                }

                                let baseName = itemHtml.replace(/<[^>]+>/g, '').replace(/[「」『』]/g, '').trim();
                                const searchName = baseName.split(/[（(＜<＋+]/)[0].trim();
                                
                                if (!searchName || /^[＋+or\d\sランクRankＡ-ＺA-Z]+$/.test(searchName) || searchName.includes('好きな武器') || searchName.includes('好きな装備') || searchName.includes('その他の')) {
                                    if (/^[＋+or\d\sＡ-ＺA-Z]+$/.test(itemHtml) || itemHtml.includes('好きな') || itemHtml.includes('その他の')) {
                                        return `<span style="color:#a8e063;font-weight:700;">${itemHtml}</span>`;
                                    }
                                    return itemHtml;
                                }

                                const normalizedName = normalizeEquipmentName(searchName, false);
                                const url = linkMap[normalizedName];
                                if (url) {
                                    return `<a href="${url}" target="_blank" class="auto-link">${itemHtml}</a>`;
                                } else {
                                    if (/^[＋+or\d\sＡ-ＺA-Z]+$/.test(itemHtml) || itemHtml.includes('好きな') || itemHtml.includes('その他の')) {
                                        return `<span style="color:#a8e063;font-weight:700;">${itemHtml}</span>`;
                                    }
                                    return itemHtml;
                                }
                            });
                            li.innerHTML = prefix + items.join(' or ');
                        }
                    });

                    // テーブルセル(td)内の装備名リンク化処理
                    tempDiv.querySelectorAll('td').forEach(td => {
                        if (td.querySelector('a')) return;

                        let baseHtml = td.innerHTML.trim();
                        let baseName = td.textContent.trim();
                        const searchName = baseName.split(/[（(＜<＋+]/)[0].trim();
                        
                        if (!searchName || /^[＋+or\d\sランクRankＡ-ＺA-Z]+$/.test(searchName) || searchName.includes('好きな武器') || searchName.includes('好きな装備') || searchName.includes('その他の')) {
                            if (/^[＋+or\d\sＡ-ＺA-Z]+$/.test(baseHtml) || baseHtml.includes('好きな') || baseHtml.includes('その他の')) {
                                td.innerHTML = `<span style="color:#a8e063;font-weight:700;">${baseHtml}</span>`;
                            }
                            return;
                        }

                        const normalizedName = normalizeEquipmentName(searchName, false);
                        const url = linkMap[normalizedName];
                        if (url) {
                            td.innerHTML = `<a href="${url}" target="_blank" class="auto-link">${baseHtml}</a>`;
                        } else {
                            if (/^[＋+or\d\sＡ-ＺA-Z]+$/.test(baseHtml) || baseHtml.includes('好きな') || baseHtml.includes('その他の')) {
                                td.innerHTML = `<span style="color:#a8e063;font-weight:700;">${baseHtml}</span>`;
                            }
                        }
                    });

                    // プレミアム拡張：通常の文章内のキーワードを用語辞典へ自動リンク化（正規表現による超高速置換）
                    const autoLinkTextNodes = (node) => {
                        if (node.nodeType === Node.TEXT_NODE) {
                            const text = node.textContent;
                            if (autoLinkRegex.test(text)) {
                                autoLinkRegex.lastIndex = 0; // RegExpのインデックスをリセット
                                const parent = node.parentNode;
                                const tempSpan = document.createElement('span');
                                tempSpan.innerHTML = text.replace(autoLinkRegex, (match) => {
                                    const normalizedName = normalizeEquipmentName(match, false);
                                    const url = linkMap[normalizedName];
                                    if (url) {
                                        return `<a href="${url}" target="_blank" class="auto-link">${match}</a>`;
                                    }
                                    return match;
                                });
                                
                                // tempSpan の子ノードを元のテキストノードの場所に挿入
                                while (tempSpan.firstChild) {
                                    parent.insertBefore(tempSpan.firstChild, node);
                                }
                                parent.removeChild(node);
                            }
                        } else if (node.nodeType === Node.ELEMENT_NODE) {
                            if (node.tagName !== 'A' && node.tagName !== 'PRE' && node.tagName !== 'CODE' && node.tagName !== 'SCRIPT' && node.tagName !== 'STYLE') {
                                const children = Array.from(node.childNodes);
                                children.forEach(child => autoLinkTextNodes(child));
                            }
                        }
                    };
                    autoLinkTextNodes(tempDiv);

                    contentDiv.innerHTML = tempDiv.innerHTML;

                    // リンクの挙動を調整（外部サイトは別タブ、サイト内は同タブ）
                    contentDiv.querySelectorAll('a').forEach(a => {
                        const isExternal = a.hostname && a.hostname !== window.location.hostname;
                        if (isExternal || (a.href.startsWith('http') && !a.href.includes(window.location.hostname))) {
                            a.setAttribute('target', '_blank');
                            a.rel = 'noopener noreferrer';
                        } else {
                            a.setAttribute('target', '_self');
                        }

                        if (!a.classList.contains('auto-link')) {
                            // Markdown由来のリンクにもスタイルを適用
                            a.style.color = '#a8e063';
                            a.style.fontWeight = '700';
                            a.style.textDecoration = 'none';
                            a.style.borderBottom = '1px dashed #a8e063';
                        }
                    });

                    const tocList = document.getElementById('toc-list');
                    contentDiv.querySelectorAll('h2, h3').forEach((h, i) => {
                         h.id = 'h-' + i;
                         const tli = document.createElement('li');
                         tli.style.marginLeft = h.tagName === 'H3' ? '1rem' : '0';
                         tli.innerHTML = `<a href="#${h.id}">${h.textContent}</a>`;
                         tocList.appendChild(tli);
                     });
 
                     // ハッシュがある場合は、レンダリング後にその位置までスクロール
                     if (window.location.hash) {
                         setTimeout(() => {
                             const id = window.location.hash.substring(1);
                             const target = document.getElementById(id);
                             if (target) {
                                 target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                             }
                         }, 100);
                     }

                     // ページ訪問時のアクセスログを非同期で送信
                     logAccess();
 
                 })
                 .catch(e => contentDiv.innerHTML = `<h2>Error</h2><p>${e}</p>`);
         }

         /**
          * ページ訪問時のアクセスログを非同期で送信
          */
         async function logAccess() {
             try {
                 const params = new URLSearchParams({
                     action: 'log',
                     pageTitle: document.title,
                     pageUrl: window.location.href,
                     referrer: document.referrer || "直接入力/ブックマーク",
                     userAgent: navigator.userAgent,
                     language: navigator.language,
                     screenResolution: `${window.screen.width}x${window.screen.height}`
                 });

                 await fetch(`${GAS_API_URL}?${params.toString()}`, {
                     method: 'GET',
                     mode: 'cors'
                 });
             } catch (error) {
                 console.warn("Logger connection skipped:", error);
             }
         }

         const backToTopBtn = document.getElementById('fixed-back-to-top');
         if (backToTopBtn) {
             window.addEventListener('scroll', () => {
                const scrolled = window.pageYOffset || document.documentElement.scrollTop;
                if (scrolled > 400) {
                    backToTopBtn.classList.add('visible');
                    backToTopBtn.style.opacity = '1';
                    backToTopBtn.style.visibility = 'visible';
                    backToTopBtn.style.transform = 'translateY(0)';
                } else {
                    backToTopBtn.classList.remove('visible');
                    backToTopBtn.style.opacity = '0';
                    backToTopBtn.style.visibility = 'hidden';
                    backToTopBtn.style.transform = 'translateY(20px)';
                }
            }, { passive: true });
             backToTopBtn.addEventListener('click', (e) => {
                 e.preventDefault();
                 window.scrollTo({ top: 0, behavior: 'smooth' });
             });
         }

         // === コメント機能のJavaScriptロジック🐾 ===
         const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
         const commentsList = document.getElementById('comments-list');
         const commentForm = document.getElementById('comment-form');
         const commentNickname = document.getElementById('comment-nickname');
         const commentContent = document.getElementById('comment-content');
         const commentMessage = document.getElementById('comment-message');
         const commentSubmitBtn = document.getElementById('comment-submit-btn');

         // お上品フィルター（送信前の簡易NGワードチェック）
         function checkNsfwWords(text) {
             const defaultNgWords = [
                 'ちんちん', 'ちんこ', 'まんこ', 'おまんこ', 'うんこ', 'うんち', 
                 'ぺにす', 'ペニス', 'ヴぁぎな', 'ヴァギナ', 'ばぎな', 'バギナ',
                 'ちんぽ', 'チンポ', 'きんたま', '金玉', 'おめこ', 'おてぃんてぃん'
             ];
             for (let word of defaultNgWords) {
                 if (text.includes(word)) {
                     return true;
                 }
             }
             return false;
         }

         // コメント一覧の読み込み
         async function loadComments() {
             if (!supabase || !file) {
                 commentsList.innerHTML = '<p style="opacity: 0.6; font-size: 0.95rem;">データベースの接続が初期化されていません。</p>';
                 return;
             }

             try {
                 const { data, error } = await supabase
                     .from('comments')
                     .select('nickname, content, created_at')
                     .eq('article_id', file)
                     .eq('is_approved', true)
                     .order('created_at', { ascending: true });

                 if (error) throw error;

                 if (!data || data.length === 0) {
                     commentsList.innerHTML = '<p style="opacity: 0.6; font-size: 0.95rem;">最初のコメントを投稿してみましょう！🐾</p>';
                     return;
                 }

                 commentsList.innerHTML = data.map(comment => {
                     const date = new Date(comment.created_at).toLocaleString('ja-JP', {
                         year: 'numeric',
                         month: '2-digit',
                         day: '2-digit',
                         hour: '2-digit',
                         minute: '2-digit'
                     });
                     // XSS対策のサニタイズ
                     const safeNickname = comment.nickname.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                     const safeContent = comment.content.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                     
                     return `
                         <div class="comment-card">
                             <div class="comment-meta">
                                 <span class="comment-author"><i class="fa-solid fa-user"></i> ${safeNickname}</span>
                                 <div style="display: flex; align-items: center; gap: 0.8rem;">
                                     <span class="comment-date">${date}</span>
                                     <button class="reply-btn" data-nickname="${safeNickname}" style="background: none; border: none; color: var(--accent-color); cursor: pointer; font-size: 0.8rem; padding: 0; display: flex; align-items: center; gap: 0.2rem; opacity: 0.7; transition: opacity 0.2s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.7'">
                                         <i class="fa-solid fa-reply"></i> 返信
                                     </button>
                                 </div>
                             </div>
                             <div class="comment-body">${safeContent}</div>
                         </div>
                     `;
                 }).join('');
             } catch (err) {
                 console.error('Error loading comments:', err);
                 commentsList.innerHTML = '<p style="color: #ff6b6b; font-size: 0.95rem;">コメントの読み込みに失敗しました。</p>';
             }
         }

         // コメント投稿処理
         if (commentForm) {
             commentForm.addEventListener('submit', async (e) => {
                 e.preventDefault();

                 if (!supabase || !file) {
                     showMessage('データベースの接続エラーが発生しました。', 'red');
                     return;
                 }

                 const nickname = commentNickname.value.trim() || '名無しの旅人';
                 const content = commentContent.value.trim();

                 if (!content) return;

                 // 簡易お上品フィルターチェック
                 if (checkNsfwWords(nickname) || checkNsfwWords(content)) {
                     showMessage('お上品な言葉づかいで投稿をお願いいたします', 'red');
                     return;
                 }

                 // 同一端末からの連投ガード（60秒制限）
                 const lastPostTime = localStorage.getItem('last_comment_time_' + file);
                 if (lastPostTime && (Date.now() - parseInt(lastPostTime)) < 60000) {
                     const remain = Math.ceil((60000 - (Date.now() - parseInt(lastPostTime))) / 1000);
                     showMessage(`連続投稿は制限されています。あと ${remain} 秒ほどお待ちください。`, 'red');
                     return;
                 }

                 // 送信ボタンの無効化（ローディング）
                 commentSubmitBtn.disabled = true;
                 const origBtnHtml = commentSubmitBtn.innerHTML;
                 commentSubmitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 送信中...';

                 try {
                     const { error } = await supabase
                         .from('comments')
                         .insert([
                             {
                                 article_id: file,
                                 nickname: nickname,
                                 content: content
                             }
                         ]);

                     if (error) throw error;

                     // Gmail通知用のGASリクエスト送信（バックグラウンドで実行し、描画を妨げない）
                     try {
                         const gasParams = new URLSearchParams({
                             action: 'comment_notification',
                             pageTitle: document.title,
                             pageUrl: window.location.href,
                             nickname: nickname,
                             content: content
                         });
                         fetch(`${GAS_API_URL}?${gasParams.toString()}`, {
                             method: 'GET',
                             mode: 'cors'
                         }).catch(e => console.warn('Notification send skipped:', e));
                     } catch (err) {
                         console.warn('Gmail notification failed:', err);
                     }

                     // 投稿成功処理
                     commentContent.value = '';
                     localStorage.setItem('last_comment_time_' + file, Date.now().toString());
                     showMessage('コメントを投稿しました！', 'green');
                     
                     // コメント一覧を再ロード
                     await loadComments();
                 } catch (err) {
                     console.error('Error posting comment:', err);
                     showMessage('コメントの送信に失敗しました。', 'red');
                 } finally {
                     commentSubmitBtn.disabled = false;
                     commentSubmitBtn.innerHTML = origBtnHtml;
                 }
             });
         }

         function showMessage(text, color) {
             commentMessage.textContent = text;
             commentMessage.style.color = color === 'green' ? '#a8e063' : '#ff6b6b';
             commentMessage.style.display = 'block';
             setTimeout(() => {
                 commentMessage.style.display = 'none';
             }, 5000);
         }

         // 返信の準備とスクロール処理
         function prepareReply(nickname) {
             if (commentContent) {
                 const mention = `@${nickname} さん\n`;
                 if (!commentContent.value.startsWith(`@${nickname} さん`)) {
                     commentContent.value = mention + commentContent.value;
                 }
                 commentContent.scrollIntoView({ behavior: 'smooth', block: 'center' });
                 commentContent.focus();
             }
         }

         // イベント委譲による返信ボタンクリックの検知
         if (commentsList) {
             commentsList.addEventListener('click', (e) => {
                 const replyBtn = e.target.closest('.reply-btn');
                 if (replyBtn) {
                     const nickname = replyBtn.getAttribute('data-nickname');
                     if (nickname) {
                         prepareReply(nickname);
                     }
                 }
             });
         }

         // 初期ロード実行
         setTimeout(loadComments, 500);
     </script>

</body>
</html>
