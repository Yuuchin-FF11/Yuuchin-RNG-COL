                            if (normalizedName.includes('Mask')) normalizedName = 'Mummu Mask';
                            else if (normalizedName.includes('Gorget')) normalizedName = 'Mummu Gorget';
                            else if (normalizedName.includes('Cape')) normalizedName = 'Mummu Cape';
                            else if (normalizedName.includes('Sash')) normalizedName = 'Mummu Sash';
                        }
                        else if (normalizedName.startsWith('Carmine Finger')) normalizedName = 'Carmine Finger';
                        else if (normalizedName.startsWith('Amini') && !['Amini Caban', 'Amini Gapette', 'Amini Brague', 'Amini Bottillon', 'Amini Bottillons'].includes(normalizedName)) normalizedName = 'Amini Attire';
                        else if (normalizedName.startsWith('Orion') && !['Orion Braccae', 'Orion Beret', 'Orion Jerkin', 'Orion Gloves', 'Orion Socks'].includes(normalizedName)) normalizedName = 'Orion Attire';
                        else if (normalizedName.startsWith('Arcadian') && !['Arcadian Beret', 'Arcadian Jerkin', 'Arcadian Bracers', 'Arcadian Braccae', 'Arcadian Socks'].includes(normalizedName)) normalizedName = 'Arcadian Attire';

                        const url = linkMap[normalizedName];
                        if (url) {
                            td.innerHTML = `<a href="${url}" target="_blank" class="auto-link">${baseHtml}</a>`;
                        } else {
                            if (/^[＋+or\d\sＡ-ＺA-Z]+$/.test(baseHtml)) {
                                td.innerHTML = `<span style="color:#a8e063;font-weight:700;">${baseHtml}</span>`;
                            }
                        }
                    });

                    contentDiv.innerHTML = tempDiv.innerHTML;

                    contentDiv.querySelectorAll('a').forEach(a => {
                        const isExternal = a.hostname && a.hostname !== window.location.hostname;
                        if (isExternal || (a.href.startsWith('http') && !a.href.includes(window.location.hostname))) {
                            a.setAttribute('target', '_blank');
                            a.rel = 'noopener noreferrer';
                        } else {
                            a.setAttribute('target', '_self');
                        }
                        if (!a.classList.contains('auto-link')) {
                            a.style.color = '#a8e063';
                            a.style.fontWeight = '700';
                            a.style.textDecoration = 'none';
                            a.style.borderBottom = '1px dashed #a8e063';
                        }
                    });

                    const tocList = document.getElementById('toc-list');
                    contentDiv.querySelectorAll('h2, h3').forEach((h, i) => {
                         h.id = 'h-' + i;
                         const tli = document.createElement('li');
                         tli.style.marginLeft = h.tagName === 'H3' ? '1rem' : '0';
                         tli.innerHTML = `<a href="#${h.id}">${h.textContent}</a>`;
                         tocList.appendChild(tli);
                     });
                     if (window.location.hash) {
                         setTimeout(() => {
                             const id = window.location.hash.substring(1);
                             const target = document.getElementById(id);
                             if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                         }, 100);
                     }
                 })
                 .catch(e => contentDiv.innerHTML = `<h2>Error</h2><p>${e}</p>`);
         }
         const backToTopBtn = document.getElementById('fixed-back-to-top');
         if (backToTopBtn) {
             window.addEventListener('scroll', () => {
                 if ((window.pageYOffset || document.documentElement.scrollTop) > 400) backToTopBtn.classList.add('visible');
                 else backToTopBtn.classList.remove('visible');
             }, { passive: true });
             backToTopBtn.addEventListener('click', (e) => {
                 e.preventDefault();
                 window.scrollTo({ top: 0, behavior: 'smooth' });
             });
         }
    </script>
</body>
</html>
