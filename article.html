    <script>
        // 背景のアニメーションを動かすための最低限の処理 (script.jsがトップページ専用なので簡易的に)
        document.getElementById('particle-canvas-container').style.background = 'var(--bg-gradient)';

        // URLの ?file=〇〇 の部分を取得する
        const urlParams = new URLSearchParams(window.location.search);
        const file = urlParams.get('file');
        const contentDiv = document.getElementById('markdown-content');

        if (file) {
            // 指定されたMarkdownファイルをサーバー(ローカル)から取得
            fetch(file)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('記事が見つかりませんでした。ファイル名やパスが正しいか確認してください。');
                    }
                    return response.text();
                })
                .then(text => {
                    // marked.js を使って Markdownテキスト を HTML に変換
                    contentDiv.innerHTML = marked.parse(text);

                    // --- 目次(TOC)の自動生成 ---
                    const headings = contentDiv.querySelectorAll('h2, h3');
                    const tocList = document.getElementById('toc-list');
                    const tocSidebar = document.getElementById('toc-sidebar');
                    if (headings.length > 0) {
                        headings.forEach((heading, index) => {
                            const id = 'heading-' + index;
                            heading.id = id;
                            
                            const li = document.createElement('li');
                            li.style.marginLeft = heading.tagName === 'H3' ? '1rem' : '0';
                            li.style.fontSize = heading.tagName === 'H3' ? '0.85rem' : '0.95rem';
                            
                            const a = document.createElement('a');
                            a.href = '#' + id;
                            a.textContent = heading.textContent;
                            
                            li.appendChild(a);
                            tocList.appendChild(li);
                        });
                    }
                    
                    // --- トップへ戻るボタン ---
                    const backToTop = document.getElementById('back-to-top');
                    window.addEventListener('scroll', () => {
                        if (window.scrollY > 300) {
                            backToTop.style.display = 'flex';
                        } else {

                    };

                    // リストアイテム(li)のうち、プレフィックスが以下のいずれかと完全一致する行のみを対象にする
                    const exactKeywords = ['武器メイン', 'サブ', '遠隔武器', '矢弾', '頭', '胴', '両手', '両脚', '両足', '首', '左耳', '右耳', '左手の指', '右手の指', '背', '腰'];
                    
                    document.querySelectorAll('#markdown-content li').forEach(li => {
                        const textContent = li.textContent.trim();
                        const textColonIndex = textContent.search(/[:：]/);
                        
                        if (textColonIndex !== -1 && textColonIndex < 15) {
                            const prefixText = textContent.substring(0, textColonIndex).trim();
                            
                            // プレフィックスが正確な装備部位名と一致する場合のみ処理（解説文の巻き込み防止）
                            if (exactKeywords.includes(prefixText)) {
                                const colonIndex = li.innerHTML.search(/[:：]/);
                                const prefix = li.innerHTML.substring(0, colonIndex + 1);
                                const rest = li.innerHTML.substring(colonIndex + 1).trim();
                                
                                // "ロスタムA or B" のような表記をひとまとまりにするため、一時的に保護
                                let safeRest = rest.replace(/([Ａ-ＺA-Z])\s*or\s*([Ａ-ＺA-Z])/g, '$1_OR_$2');
                                
                                // " or " で複数の装備が並んでいる場合、それぞれを分割して個別に処理する
                                let parts = safeRest.split(/\s+or\s+/);
                                
                                let linkedParts = parts.map(part => {
                                    // 保護していた "A or B" を戻す
                                    let originalPartText = part.replace(/_OR_/g, ' or ').trim();
                                    
                                    // 個別のパーツから装備名本体とカッコ等のサフィックスを分離
                                    let equipName = originalPartText;
                                    let suffix = "";
                                    const match = originalPartText.match(/^([^（(<]+)(.*)$/);
                                    if (match) {
                                        equipName = match[1].trim();
                                        suffix = match[2];
                                    }
                                    
                                    // 強化段階などを削除して検索用のベース名を作る
                                    let baseName = equipName
                                        .replace(/[Ａ-ＺA-Z]\s*or\s*[Ａ-ＺA-Z]|[Ａ-ＺA-Z]$/g, '') // A or B, あるいは末尾の A, B, C
                                        .replace(/[＋\+][０-９0-9]/g, '') // +1, +2, +3, +4
                                        .replace(/等$/, '') // "ロスタム等" の "等" を削除
                                        .trim();
                                        
                                    // プレイヤーがよく使う略称（LA, CSなど）を正式名称の接頭辞に変換する
                                    const abbrMap = {
                                        'ＬＡ': 'ラヌン',
                                        'ＣＳ': 'シャスー',
                                        'ＬＫ': 'ラクサマナ',
                                        'ＬＵ': 'ルザフ',
                                        'ＨＶ': 'ハーバートン'
                                    };
                                    for (let key in abbrMap) {
                                        if (baseName.startsWith(key)) {
                                            baseName = baseName.replace(key, abbrMap[key]);
                                        }
                                    }

                                    // 用語辞典の仕様対策：部位ごとのページが存在せず「装束」「アタイア」等にまとまっているものを変換
                                    if (baseName.startsWith('ニャメ')) {
                                        baseName = 'ニャメ装束';
                                    } else if (baseName.startsWith('イケンガ')) {
                                        baseName = 'イケンガ装束';
                                    } else if (baseName.startsWith('マリグナス') && !baseName.includes('ピアス') && !baseName.includes('リング')) {
                                        baseName = 'マリグナス装束';
                                    } else if (baseName.startsWith('ラヌン') && !baseName.includes('ナイフ')) {
                                        baseName = 'ラヌンアタイア';
                                    } else if (baseName.startsWith('シャスー') && !baseName.includes('ピアス')) {
                                        baseName = 'シャスーアタイア';
                                    } else if (baseName.startsWith('ラクサマナ')) {
                                        baseName = 'ラクサマナアタイア';
                                    } else if (baseName.startsWith('アデマ')) {
                                        baseName = 'アデマ装束';
                                    } else if (baseName.startsWith('テーオン')) {
                                        baseName = 'テーオン装束';
                                    } else if (baseName.startsWith('オショシ')) {
                                        baseName = 'オショシ装束';
                                    } else if (baseName.startsWith('ヘルクリア')) {
                                        baseName = 'ヘルクリア装束';
                                    }
                                    
                                    let url = linkMap[baseName];
                                    if (!url) {
                                        // 「その他」や「好きな」などの記述が含まれている場合はリンク化せず、見た目だけ装備品の色（緑）に合わせる
                                        if (originalPartText.includes('その他') || originalPartText.includes('好きな')) {
                                            return `<span style="color: #a8e063; font-weight: bold;">${originalPartText}</span>`;
                                        }
                                        // 辞書未登録のハイエンド装備等は、DuckDuckGoの「I'm Feeling Lucky(!ducky)」機能を使って
                                        // 検索画面をスキップし、直接FF11用語辞典の該当ページへジャンプさせる
                                        url = `https://duckduckgo.com/?q=!ducky+site:wiki.ffo.jp+${encodeURIComponent(baseName)}`;
                                    }
                                    
                                    return `<a href="${url}" target="_blank" class="equip-link" style="color: #a8e063; text-decoration: none; font-weight: bold; border-bottom: 1px dashed #a8e063; padding-bottom: 1px; transition: all 0.3s;" onmouseover="this.style.color='#ff9d00'; this.style.borderBottomColor='#ff9d00';" onmouseout="this.style.color='#a8e063'; this.style.borderBottomColor='#a8e063';"><i class="fa-solid fa-magnifying-glass" style="font-size: 0.8em; margin-right: 4px;"></i>${equipName}</a><span style="color: #e0e0e0;">${suffix}</span>`;
                                });
                                
                                li.innerHTML = `${prefix} ${linkedParts.join(' <span style="color: #ccc; font-weight: normal; font-size: 0.9em;">or</span> ')}`;
                            }
                        }
                    // --- 指定されたアンカー（#hash）へのスクロール ---
                    if (window.location.hash) {
                        const targetId = decodeURIComponent(window.location.hash.substring(1));
                        const targetElement = document.getElementById(targetId);
                        if (targetElement) {
                            setTimeout(() => {
                                targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                                // ヘッダーの高さを考慮して少し上に調整
                                window.scrollBy(0, -100);
                            }, 500);
                        }
                    }
                });
            })
            .catch(error => {
                    contentDiv.innerHTML = `
                        <h2 style="color: #ff6b6b; margin-top: 0;">エラーが発生しました</h2>
                        <p>${error.message}</p>
                    `;
                });
        } else {
            contentDiv.innerHTML = `
                <h2 style="color: #ff6b6b; margin-top: 0;">エラー</h2>
                <p>表示する記事が指定されていません。</p>
            `;
        }
    </script>
</body>
</html>
