<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFXI 連携逆引きシミュレーター</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- PWA対応 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#eab308">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>FFXI 連携逆引きシミュレーター</h1>
            <p>使用する「2つの武器種」と「狙いたい連携」を選ぶだけで、最適なWSの組み合わせを一瞬で逆引き探索します 🐾</p>
            <p style="font-size: 0.85rem; color: rgba(255, 255, 255, 0.7); margin-top: 0.5rem; line-height: 1.4;">
                ※本シミュレーターはAIで作成したもので少しこちらで調整もしましたが、もしかしたら間違った連携があるかもしれませんのでご了承ください。
            </p>
        </header>

        <!-- 保存されたお気に入り連携（お気に入りがある場合のみ表示されます） 🐾 -->
        <section id="favorites-section" class="glass-card" style="display: none; margin-bottom: 1.5rem; padding: 1.25rem;">
            <h2 class="card-title" style="font-size: 1.1rem; margin-bottom: 0.5rem; border-bottom: none; padding-bottom: 0; display: flex; align-items: center; gap: 0.5rem;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="color: var(--accent-color);"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                お気に入り連携リスト
            </h2>
            <div id="favorites-list" style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.75rem;">
                <!-- 動的にお気に入り登録されたチップが追加されます -->
            </div>
        </section>

        <main class="main-card glass-card">
            <div class="form-grid">
                <!-- 武器1 -->
                <div class="form-group">
                    <label for="weapon-1">1段目の武器種 (トス側)</label>
                    <select id="weapon-1">
                        <option value="HandToHand">格闘 (Hand-to-Hand)</option>
                        <option value="Dagger">短剣 (Dagger)</option>
                        <option value="Sword" selected>片手剣 (Sword)</option>
                        <option value="GreatSword">両手剣 (Great Sword)</option>
                        <option value="Axe">片手斧 (Axe)</option>
                        <option value="GreatAxe">両手斧 (Great Axe)</option>
                        <option value="Scythe">両手鎌 (Scythe)</option>
                        <option value="Polearm">両手槍 (Polearm)</option>
                        <option value="Katana">片手刀 (Katana)</option>
                        <option value="GreatKatana">両手刀 (Great Katana)</option>
                        <option value="Club">片手棍 (Club)</option>
                        <option value="Staff">両手棍 (Staff)</option>
                        <option value="Bow">弓術 (Bow)</option>
                        <option value="Marksmanship">射撃 (Marksmanship)</option>
                    </select>
                </div>

                <!-- 武器2 -->
                <div class="form-group">
                    <label for="weapon-2">2段目の武器種 (〆側)</label>
                    <select id="weapon-2">
                        <option value="HandToHand">格闘 (Hand-to-Hand)</option>
                        <option value="Dagger" selected>短剣 (Dagger)</option>
                        <option value="Sword">片手剣 (Sword)</option>
                        <option value="GreatSword">両手剣 (Great Sword)</option>
                        <option value="Axe">片手斧 (Axe)</option>
                        <option value="GreatAxe">両手斧 (Great Axe)</option>
                        <option value="Scythe">両手鎌 (Scythe)</option>
                        <option value="Polearm">両手槍 (Polearm)</option>
                        <option value="Katana">片手刀 (Katana)</option>
                        <option value="GreatKatana">両手刀 (Great Katana)</option>
                        <option value="Club">片手棍 (Club)</option>
                        <option value="Staff">両手棍 (Staff)</option>
                        <option value="Bow">弓術 (Bow)</option>
                        <option value="Marksmanship">射撃 (Marksmanship)</option>
                    </select>
                </div>

                <!-- 狙う連携 -->
                <div class="form-group">
                    <label for="target-chain">狙いたい連携属性</label>
                    <select id="target-chain">
                        <option value="ANY" selected>すべての連携を表示</option>
                        <option value="極光">【イオAM限定】極光 (Lv4) ［光 ＋ 光（AM中）］</option>
                        <option value="黒闇">【イオAM限定】極闇/黒闇 (Lv4) ［闇 ＋ 闇（AM中）］</option>
                        <option value="光">光 (Lv3) ［核熱 ＋ 湾曲 / 湾曲 ＋ 核熱］</option>
                        <option value="闇">闇 (Lv3) ［重力 ＋ 分解 / 分解 ＋ 重力］</option>
                        <option value="分解">分解 (Lv2) ［貫通 ＋ 切断 / 収縮 ＋ 貫通］</option>
                        <option value="湾曲">湾曲 (Lv2) ［振動 ＋ 貫通 / 収縮 ＋ 振動］</option>
                        <option value="重力">重力 (Lv2) ［炸裂 ＋ 収縮 / 切断 ＋ 収縮］</option>
                        <option value="核熱">核熱 (Lv2) ［溶解 ＋ 衝撃 / 衝撃 ＋ 溶解］</option>
                        <option value="Lv1">すべてのLv1連携 (溶解、切断、炸裂、振動、貫通、衝撃、収縮等)</option>
                    </select>
                </div>

                <!-- 連携の接続段数 -->
                <div class="form-group">
                    <label for="target-steps">連携の接続段数 (WS数)</label>
                    <select id="target-steps">
                        <option value="2" selected>2手連携 (WS 2回：通常トス＆〆)</option>
                        <option value="3">3手連携 (WS 3回：3連コンボ)</option>
                        <option value="4">4手連携 (WS 4回：4連コンボ)</option>
                        <option value="5">5手連携 (WS 5回：最長通常ループ限界)</option>
                        <option value="6">6手連携 (WS 6回：究極AM1極光・極闇限界)</option>
                    </select>
                </div>

                <!-- 初期アフターマス（多段連携時のみ表示） -->
                <div class="form-group" id="initial-am-group" style="display: none;">
                    <label for="initial-am">初期アフターマス状態 (3手以上時)</label>
                    <select id="initial-am">
                        <option value="NONE" selected>なし (通常スタート)</option>
                        <option value="IONIC_AM1">イオニック AM1 (4連以上で極光/黒闇)</option>
                        <option value="IONIC_AM2">イオニック AM2 (3連以上で極光/黒闇)</option>
                        <option value="IONIC_AM3">イオニック AM3 (2連以上で極光/黒闇🐾)</option>
                    </select>
                </div>

                <!-- 順不同チェックボックス -->
                <div class="form-group" style="display: flex; align-items: center; margin-top: 1.5rem; grid-column: span 2;">
                    <input type="checkbox" id="unordered-weapons" checked style="width: 20px; height: 20px; margin-right: 0.5rem; cursor: pointer; accent-color: var(--accent-color);">
                    <label for="unordered-weapons" style="cursor: pointer; margin-bottom: 0; user-select: none; font-weight: bold; color: var(--accent-color);">武器の順序を問わない (順不同でトス・〆両方の可能性を同時検索) 🐾</label>
                </div>

            </div>

            <div class="action-area" style="display: flex; gap: 1rem; justify-content: center;">
                <button id="btn-search" class="btn btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    連携ルートを探索する
                </button>
                <button id="btn-add-fav" class="btn btn-secondary" style="border-color: rgba(234, 179, 8, 0.4); color: #fbbf24; padding: 1rem 1.5rem; display: inline-flex; align-items: center; gap: 0.5rem;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="color: #fbbf24;"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                    お気に入りに保存
                </button>
            </div>
        </main>

        <!-- 結果表示エリア -->
        <section class="results-section">
            <h2 class="section-title">探索結果 <span id="result-count" class="badge">0件</span></h2>
            <div id="results-list" class="results-grid">
                <!-- 動的に結果カードが追加されます -->
            </div>
            <div id="no-results" class="glass-card empty-state" style="display: none;">
                選択された組み合わせで、狙った連携を発生させるルートは見つかりませんでした。別の連携属性や武器種をお試しください🐾
            </div>
        </section>

        <footer class="footer-info">
            <p>&copy; Yuuchin FFXI Utility | Developed by Antigravity 🐾</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
