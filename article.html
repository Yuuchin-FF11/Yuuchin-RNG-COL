                    const tempDiv = document.createElement('div');

                    tempDiv.querySelectorAll('li').forEach(li => {
                        const txt = li.textContent.trim();
                        const colonIdx = txt.search(/[:：]/);
                        if (colonIdx !== -1 && keywords.some(k => txt.startsWith(k))) {
                            const prefix = txt.substring(0, colonIdx + 1) + ' ';
                            const restHtml = li.innerHTML.substring(li.innerHTML.search(/[:：]/) + 1).trim();
                            const items = restHtml.split(/\s+or\s+/).map(itemHtml => {
                                // すでにリンクが含まれている場合は、二重リンクを避けるためにラップしない
                                if (itemHtml.includes('<a ')) {
                                    return itemHtml.replace(/(<\/a>)\s*([（(][^）)]+[）)])/g, '$1<span style="color:#a8e063;font-weight:700;">$2</span>');
                                }

                                let baseName = itemHtml.replace(/<[^>]+>/g, '').replace(/[「」『』]/g, '').trim();
                                // カッコ・プラス以降を削除して検索用ベース名を作成
                                const searchName = baseName.split(/[（(＜<＋+]/)[0].trim();
                                
                                // 数値や記号のみ、英字1文字、または特定のキーワードの場合はリンクにしない
                                if (!searchName || /^[＋+or\d\sランクRankＡ-ＺA-Z]+$/.test(searchName) || searchName.includes('好きな武器') || searchName.includes('好きな装備') || searchName.includes('その他の')) {
                                    // ランク表記やプレースホルダには装備品と同じ色を適用する
                                    if (/^[＋+or\d\sＡ-ＺA-Z]+$/.test(itemHtml) || itemHtml.includes('好きな武器') || itemHtml.includes('好きな装備') || itemHtml.includes('その他の')) {
                                        return `<span style="color:#a8e063;font-weight:700;">${itemHtml}</span>`;
                                    }
                                    return itemHtml;
                                }

                                // 略称変換（LA, CS, LK など）
                                let normalizedName = searchName;
                                const abbrMap = {
                                    'ＬＡ': 'ラヌン', 'LA': 'ラヌン',
                                    'ＣＳ': 'シャスー', 'CS': 'シャスー',
                                    'ＬＫ': 'ラクサマナ', 'LK': 'ラクサマナ',
                                    'ＬＵ': 'ルザフ', 'LU': 'ルザフ',
                                    'ＨＶ': 'ハーバートン', 'HV': 'ハーバートン',
                                    'ＡＭ': 'アミニ', 'AM': 'アミニ',
                                    'ＯＲ': 'オリオン', 'OR': 'オリオン',
                                    'ＡＲ': 'アルケ', 'AR': 'アルケ'
                                };
                                for (let key in abbrMap) {
                                    if (normalizedName.startsWith(key)) {
                                        normalizedName = normalizedName.replace(key, abbrMap[key]);
                                        break;
                                    }
                                }

                                // ランク文字の削除
                                normalizedName = normalizedName.replace(/[Ａ-ＺA-Z]$/, '').trim();

                                // 装備品名の正規化（続き）
                                if (normalizedName.startsWith('ニャメ')) normalizedName = 'ニャメ装束';
                                else if (normalizedName.startsWith('イケンガ')) normalizedName = 'イケンガ装束';
                                else if (normalizedName.startsWith('マリグナス') && !normalizedName.includes('ピアス')) normalizedName = 'マリグナス装束';
                                else if (normalizedName.startsWith('ラヌン') && !normalizedName.includes('ナイフ')) normalizedName = 'ラヌンアタイア';
                                else if (normalizedName.startsWith('シャスー') && !normalizedName.includes('ピアス')) normalizedName = 'シャスーアタイア';
                                else if (normalizedName.startsWith('ラクサマナ')) normalizedName = 'ラクサマナアタイア';
                                else if (normalizedName.startsWith('ロスタム')) normalizedName = 'ロスタム';
                                else if (normalizedName.startsWith('アデマ')) normalizedName = 'アデマ装束';
                                else if (normalizedName.startsWith('テーオン')) normalizedName = 'テーオン装束';
                                else if (normalizedName.startsWith('ヘルクリア')) normalizedName = 'ヘルクリア装束';
                                else if (normalizedName.startsWith('オショシ')) normalizedName = 'オショシ装束';
                                else if (normalizedName.startsWith('ハーバートン')) normalizedName = 'ハーバートンリング';
                                else if (normalizedName.startsWith('ルザフ')) normalizedName = 'ルザフリング';
                                else if (normalizedName.startsWith('アミニ') && !['アミニカバン', 'アミニガペット', 'アミニブラーグ', 'アミニボティヨン'].includes(normalizedName)) normalizedName = 'アミニアタイア';
                                else if (normalizedName.startsWith('オリオン') && !['オリオンブラッカエ', 'オリオンベレー', 'オリオンジャーキン', 'オリオングローブ', 'オリオンソックス'].includes(normalizedName)) normalizedName = 'オリオンアタイア';
                                else if (normalizedName.startsWith('ベレナ')) normalizedName = 'ベレナスケープ';
                                else if (normalizedName.startsWith('スカウト')) normalizedName = 'スカウトゴルゲット';
                                else if (normalizedName.startsWith('アルケ') && !['アルケベレー', 'アルケジャーキン', 'アルケブレーサー', 'アルケブラッカエ', 'アルケソックス'].includes(normalizedName)) normalizedName = 'アルケアタイア';
                                else if (normalizedName.startsWith('アルカディア') && !['アルカディアベレー', 'アルカディアジャーキン', 'アルカディアグローブ', 'アルカディアブラッカエ', 'アルカディアソックス'].includes(normalizedName)) normalizedName = 'アルカディアアタイア';

                                const url = linkMap[normalizedName];
                                if (url) {
                                    // 登録されている装備品のみリンクを貼る
                                    return `<a href="${url}" target="_blank" class="auto-link">${itemHtml}</a>`;
                                } else {
                                    // リンクはないが、ランク表記や特定のプレースホルダなら彩色だけ行う
                                    if (/^[＋+or\d\sＡ-ＺA-Z]+$/.test(itemHtml) || itemHtml.includes('好きな') || itemHtml.includes('その他の')) {
                                        return `<span style="color:#a8e063;font-weight:700;">${itemHtml}</span>`;
                                    }
                                    return itemHtml;
                                }
                            });
                            li.innerHTML = prefix + items.join(' or ');
                        }
                    });

                    // テーブルセル(td)内の装備名リンク化処理
                    tempDiv.querySelectorAll('td').forEach(td => {
                        if (td.querySelector('a')) return;

                        let baseHtml = td.innerHTML.trim();
                        let baseName = td.textContent.trim();
                        const searchName = baseName.split(/[（(＜<＋+]/)[0].trim();
                        
                        if (!searchName || /^[＋+or\d\sランクRankＡ-ＺA-Z]+$/.test(searchName) || searchName.includes('好きな武器') || searchName.includes('好きな装備') || searchName.includes('その他の')) {
                            if (/^[＋+or\d\sＡ-ＺA-Z]+$/.test(baseHtml) || baseHtml.includes('好きな') || baseHtml.includes('その他の')) {
                                td.innerHTML = `<span style="color:#a8e063;font-weight:700;">${baseHtml}</span>`;
                            }
                            return;
                        }

                        let normalizedName = searchName;
                        const abbrMap = {
                            'ＬＡ': 'ラヌン', 'LA': 'ラヌン',
                            'ＣＳ': 'シャスー', 'CS': 'シャスー',
                            'ＬＫ': 'ラクサマナ', 'LK': 'ラクサマナ',
                            'ＬＵ': 'ルザフ', 'LU': 'ルザフ',
                            'ＨＶ': 'ハーバートン', 'HV': 'ハーバートン',
                            'ＡＭ': 'アミニ', 'AM': 'アミニ',
                            'ＯＲ': 'オリオン', 'OR': 'オリオン',
                            'ＡＲ': 'アルケ', 'AR': 'アルケ'
                        };
                        for (let key in abbrMap) {
                            if (normalizedName.startsWith(key)) {
                                normalizedName = normalizedName.replace(key, abbrMap[key]);
                                break;
                            }
                        }

                        normalizedName = normalizedName.replace(/[Ａ-ＺA-Z]$/, '').trim();

                        if (normalizedName.startsWith('ニャメ')) normalizedName = 'ニャメ装束';
                        else if (normalizedName.startsWith('イケンガ')) normalizedName = 'イケンガ装束';
                        else if (normalizedName.startsWith('マリグナス') && !normalizedName.includes('ピアス')) normalizedName = 'マリグナス装束';
                        else if (normalizedName.startsWith('ラヌン') && !normalizedName.includes('ナイフ')) normalizedName = 'ラヌンアタイア';
                        else if (normalizedName.startsWith('シャスー') && !normalizedName.includes('ピアス')) normalizedName = 'シャスーアタイア';
                        else if (normalizedName.startsWith('ラクサマナ')) normalizedName = 'ラクサマナアタイア';
                        else if (normalizedName.startsWith('ロスタム')) normalizedName = 'ロスタム';
                        else if (normalizedName.startsWith('アデマ')) normalizedName = 'アデマ装束';
                        else if (normalizedName.startsWith('テーオン')) normalizedName = 'テーオン装束';
                        else if (normalizedName.startsWith('ヘルクリア')) normalizedName = 'ヘルクリア装束';
                        else if (normalizedName.startsWith('オショシ')) normalizedName = 'オショシ装束';
                        else if (normalizedName.startsWith('ハーバートン')) normalizedName = 'ハーバートンリング';
                        else if (normalizedName.startsWith('ルザフ')) normalizedName = 'ルザフリング';
                        else if (normalizedName.startsWith('アミニ') && !['アミニカバン', 'アミニガペット', 'アミニブラーグ', 'アミニボティヨン'].includes(normalizedName)) normalizedName = 'アミニアタイア';
                        else if (normalizedName.startsWith('オリオン') && !['オリオンブラッカエ', 'オリオンベレー', 'オリオンジャーキン', 'オリオングローブ', 'オリオンソックス'].includes(normalizedName)) normalizedName = 'オリオンアタイア';
                        else if (normalizedName.startsWith('ベレナ')) normalizedName = 'ベレナスケープ';
                        else if (normalizedName.startsWith('スカウト')) normalizedName = 'スカウトゴルゲット';
                        else if (normalizedName.startsWith('アルケ') && !['アルケベレー', 'アルケジャーキン', 'アルケブレーサー', 'アルケブラッカエ', 'アルケソックス'].includes(normalizedName)) normalizedName = 'アルケアタイア';

                        const url = linkMap[normalizedName];
                        if (url) {
                            td.innerHTML = `<a href="${url}" target="_blank" class="auto-link">${baseHtml}</a>`;
                        } else {
                            if (/^[＋+or\d\sＡ-ＺA-Z]+$/.test(baseHtml) || baseHtml.includes('好きな') || baseHtml.includes('その他の')) {
                                td.innerHTML = `<span style="color:#a8e063;font-weight:700;">${baseHtml}</span>`;
                            }
                        }
                    });

                    // プレミアム拡張：通常の文章内のキーワードを用語辞典へ自動リンク化
                    const autoLinkTextNodes = (node) => {
                        if (node.nodeType === Node.TEXT_NODE) {
                            let text = node.nodeValue;
                            const sortedKeys = Object.keys(linkMap).sort((a, b) => b.length - a.length);

                            for (const keyword of sortedKeys) {
                                const idx = text.indexOf(keyword);
                                if (idx !== -1) {
                                    const beforeText = text.substring(0, idx);
                                    const matchedText = text.substring(idx, idx + keyword.length);
                                    const afterText = text.substring(idx + keyword.length);

                                    const beforeNode = document.createTextNode(beforeText);
                                    const linkNode = document.createElement('a');
                                    linkNode.href = linkMap[keyword];
                                    linkNode.target = '_blank';
                                    linkNode.className = 'auto-link';
                                    linkNode.textContent = matchedText;
                                    
                                    const afterNode = document.createTextNode(afterText);

                                    const parent = node.parentNode;
                                    parent.insertBefore(beforeNode, node);
                                    parent.insertBefore(linkNode, node);
                                    parent.insertBefore(afterNode, node);
                                    parent.removeChild(node);

                                    autoLinkTextNodes(afterNode);
                                    return;
                                }
                            }
                        } else if (node.nodeType === Node.ELEMENT_NODE) {
                            if (node.tagName !== 'A' && node.tagName !== 'PRE' && node.tagName !== 'CODE' && node.tagName !== 'SCRIPT' && node.tagName !== 'STYLE') {
                                const children = Array.from(node.childNodes);
                                children.forEach(child => autoLinkTextNodes(child));
                            }
                        }
                    };
                    autoLinkTextNodes(tempDiv);

                    contentDiv.innerHTML = tempDiv.innerHTML;

                    // リンクの挙動を調整（外部サイトは別タブ、サイト内は同タブ）
                    contentDiv.querySelectorAll('a').forEach(a => {
                        const isExternal = a.hostname && a.hostname !== window.location.hostname;
                        if (isExternal || (a.href.startsWith('http') && !a.href.includes(window.location.hostname))) {
                            a.setAttribute('target', '_blank');
                            a.rel = 'noopener noreferrer';
                        } else {
                            a.setAttribute('target', '_self');
                        }

                        if (!a.classList.contains('auto-link')) {
                            // Markdown由来のリンクにもスタイルを適用
                            a.style.color = '#a8e063';
                            a.style.fontWeight = '700';
                            a.style.textDecoration = 'none';
                            a.style.borderBottom = '1px dashed #a8e063';
                        }
                    });

                    const tocList = document.getElementById('toc-list');
                    contentDiv.querySelectorAll('h2, h3').forEach((h, i) => {
                         h.id = 'h-' + i;
                         const tli = document.createElement('li');
                         tli.style.marginLeft = h.tagName === 'H3' ? '1rem' : '0';
                         tli.innerHTML = `<a href="#${h.id}">${h.textContent}</a>`;
                         tocList.appendChild(tli);
                     });
 
                     // ハッシュがある場合は、レンダリング後にその位置までスクロール
                     if (window.location.hash) {
                         setTimeout(() => {
                             const id = window.location.hash.substring(1);
                             const target = document.getElementById(id);
                             if (target) {
                                 target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                             }
                         }, 100);
                     }
 
                 })
                 .catch(e => contentDiv.innerHTML = `<h2>Error</h2><p>${e}</p>`);
         }

         const backToTopBtn = document.getElementById('fixed-back-to-top');
         if (backToTopBtn) {
             window.addEventListener('scroll', () => {
                const scrolled = window.pageYOffset || document.documentElement.scrollTop;
                if (scrolled > 400) {
                    backToTopBtn.classList.add('visible');
                    backToTopBtn.style.opacity = '1';
                    backToTopBtn.style.visibility = 'visible';
                    backToTopBtn.style.transform = 'translateY(0)';
                } else {
                    backToTopBtn.classList.remove('visible');
                    backToTopBtn.style.opacity = '0';
                    backToTopBtn.style.visibility = 'hidden';
                    backToTopBtn.style.transform = 'translateY(20px)';
                }
            }, { passive: true });
             backToTopBtn.addEventListener('click', (e) => {
                 e.preventDefault();
                 window.scrollTo({ top: 0, behavior: 'smooth' });
             });
         }
     </script>

</body>
</html>
